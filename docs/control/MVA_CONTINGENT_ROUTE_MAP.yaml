  - id: TRIP13_F3
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does TRIP13/APC15 augmentation improve silencing at residual BubR1, exploiting the BubR1-containing substrate rather than replacing it?"
    why_unresolved: "TRIP13 acts on a BubR1-containing complex, so dependency makes it compensatory rather than dead. Whether a weaker MCC is still a usable substrate at limiting BubR1 is unasked."
    outcomes:
      improves_at_residual_bubr1: S_SIL_SUPPLIED
      no_improvement:             T_TRIP13_F3_NULL
      insufficient:               T_TRIP13_F3_REPEAT

  - id: POOL01
    kind: branch
    branch_role: OBSERVATION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Is the kinetochore pool of BubR1 the functionally limiting one, so that a pool-confined gain is sufficient?"
    why_unresolved: "A pool-confined change was treated as a failed route to whole-cell abundance, which assumes whole-cell abundance is what function needs. The case's own evidence points the other way: residual mutant protein reaches kinetochores, and BubR1 acts there. Nobody has asked whether the pool is enough."
    evidence: ["PMID:20516114", "PMID:38008853"]
    outcomes:
      pool_is_sufficient:     S_POOL_SUFFICES
      whole_cell_required:    T_POOL_INSUFFICIENT
      insufficient:           T_POOL01_REPEAT

  - id: FOLD01
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Can the raised-but-non-functional protein be brought to a native, functional state by assisting folding rather than by adding more of it?"
    why_unresolved: "Abundance and nativeness were conflated. A chaperone-retained or aggregation-prone protein can be abundant and non-functional, and the global-suppressor work reports that rescue of folding defects runs through refolding rate rather than thermodynamic stability. Nothing tests whether this substrate's functional fraction can be raised independently of its total."
    evidence: ["PMID:36037221", "PMID:20516114"]
    outcomes:
      functional_fraction_raised: S_STABILISED_FUNCTIONAL
      abundance_without_function: T_FOLD_INTRINSIC
      insufficient:               T_FOLD01_REPEAT

  - id: LIMFN01
    kind: branch
    branch_role: OBSERVATION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Which function is actually limiting missegregation in this state?"
    why_unresolved: "A composite that supplies alignment, activation and silencing and does not lower missegregation says the limiting quantity was none of them. Attachment error-correction rate, kinetochore-microtubule turnover and cohesion are candidates the map has never separated."
    outcomes:
      a_supplied_function_was_limiting: S_RETEST_COMPOSITE
      another_quantity_is_limiting:     S_NEW_CONTROL_VARIABLE
      insufficient:                     T_LIMFN01_REPEAT
  - {id: S_RETEST_COMPOSITE, kind: state, state_class: KNOWLEDGE, label: "One of the supplied functions was limiting after all: the composite is revalidated with that function's contribution isolated"}
  - {id: S_NEW_CONTROL_VARIABLE, kind: state, state_class: KNOWLEDGE, label: "A control variable outside this map limits missegregation in this state: it must be named and searched before any route can address it"}

  - id: COMPOSITE02
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does a different configuration of the same components — different stoichiometry, or temporal separation — resolve the conflict?"
    why_unresolved: "A conflict in one configuration is not a property of the component set. TRIP13's own two roles are temporally separable, which is the existence proof that configuration matters here."
    outcomes:
      reconfiguration_works: S_COMPOSITE_VALIDATED
      conflict_intrinsic:    T_COMPOSITE_INTRINSIC
      insufficient:          T_COMPOSITE02_REPEAT

  - id: ACT02
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Can arrest competence be supplied through the MPS1 phosphorylation cascade, transiently rather than chronically?"
    why_unresolved: "The first two search depths found no component; the third found a mechanistic handle — a sequential multi-target MPS1 phosphorylation cascade promotes checkpoint signalling. The same depth found that CHRONIC checkpoint activation causes myelosuppression and gastrointestinal atrophy in vivo, so the sustained form of this variable is organism-level harmful while a transient form is not covered by that evidence."
    evidence: ["PMID:28072388", "PMID:38806674"]
    outcomes:
      transient_supply_works:   S_ACT_SUPPLIED
      only_chronic_supply_works: T_ACT_CHRONIC_UNSAFE
      no_supply:                T_ACT_EXHAUSTED
      insufficient:             T_ACT02_REPEAT

  # ---------- F4: remove the cells rather than prevent the error ----------
  - {id: CV_CLEARANCE_ENTRY, kind: state, state_class: KNOWLEDGE, label: "F4 entry: the aneuploid cell fraction is itself a control variable, and the only one that can touch aneuploidy already established"}
  - id: CLEAR01
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: TISSUE_MODEL
    label: "Can the aneuploid cell fraction be lowered by promoting selective elimination of aneuploid cells?"
    why_unresolved: "Selective elimination of aneuploid cells is documented — cell competition removes segmental aneuploid cells in Drosophila imaginal discs, lineage-specific elimination operates in embryos and stem-cell-derived models, and depletion of aneuploid cells is shaped by cell-to-cell interactions. None of it is in a human MVA context, and none of it is an actuator yet."
    evidence: ["PMID:33847264", "PMID:42409819", "PMID:40466636"]
    outcomes:
      fraction_lowered_population_viable: S_TISSUE_FRACTION_FALLS
      population_depleted:                T_CLEAR_DEPLETES
      no_selective_elimination:           T_CLEAR_NULL
      insufficient:                       T_CLEAR01_REPEAT

  - id: CLIN02
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: ORGANISM_MODEL
    label: "Which clinical feature, in which tissue, on what timescale, is linked to aneuploid burden?"
    why_unresolved: "A null on one chosen clinical measure does not close the link; it closes that measure. The phenotype is multi-system and the burden-to-feature mapping is unquantified for this disorder."
    outcomes:
      a_linked_feature_exists: S_CLINICAL_MODIFIED
      no_feature_links:        T_CLINICAL_LINK_ABSENT
      unassessable:            T_CLIN02_BLOCKED

  - id: XSCALE03
    kind: branch
    branch_role: OBSERVATION
    resolves_by: MEASUREMENT
    requires: TISSUE_MODEL
    label: "Is selection or clearance, rather than per-division fidelity, what sets the tissue aneuploid fraction here?"
    why_unresolved: "Per-division fidelity improving without the tissue fraction falling means the fraction is set by something else. That is a different control variable, and it is the F4 one."
    outcomes:
      selection_dominates:    CV_CLEARANCE_ENTRY
      fidelity_dominates:     S_AGGREGATION_UNEXPLAINED
      insufficient:           T_XSCALE03_REPEAT

  # new genuine terminals from the expansion
  - {id: T_CV_ABUNDANCE_EXHAUSTED, kind: terminal, terminal: SEARCHED_EXTERNAL_UNIVERSE_EXHAUSTED, label: "Every identified actuator of BubR1 abundance failed on this substrate across two search depths"}
  - {id: T_STAB03_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Actuator engagement not validated: repeat"}
  - {id: T_CENPE_F3_NULL, kind: terminal, closes: ACTUATOR, closes_for: CV_CHROMOSOME_ALIGNMENT, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Boosting CENP-E does not help at residual BubR1 and no further CENP-E-directed experiment is identifiable"}
  - {id: T_CENPE_F3_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_KIF18A_F3_NULL, kind: terminal, closes: ACTUATOR, closes_for: CV_CHROMOSOME_ALIGNMENT, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "KIF18A modulation does not help at residual BubR1"}
  - {id: T_KIF18A_F3_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_COMBO_INSUFFICIENT, kind: terminal, closes: CONFIGURATION, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Partial abundance plus flux modification is still insufficient, and no further combination of the mapped control variables is identifiable"}
  - {id: T_UNSAFE_COMBO, kind: terminal, terminal: UNSAFE, label: "The combination harms the population where neither component did"}
  - {id: T_COMBO_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_TRIP13_INTRINSIC, kind: terminal, terminal: PHYSICALLY_INCOMPATIBLE_WITH_EVIDENCE, label: "The activation and silencing roles cannot be separated even temporally: one protein cannot be augmented for one without costing the other"}
  - {id: T_TRIP13_02_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_TRIP13_F3_NULL, kind: terminal, closes: ACTUATOR, closes_for: CV_CHECKPOINT_SILENCING, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "TRIP13 augmentation does not help at residual BubR1"}
  - {id: T_TRIP13_F3_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: S_POOL_SUFFICES, kind: state, state_class: KNOWLEDGE, label: "The kinetochore pool is the functionally limiting one, so a pool-confined abundance gain is enough and whole-cell restoration is not required"}
  - {id: T_POOL_INSUFFICIENT, kind: terminal, closes: ACTUATOR, closes_for: CV_BUBR1_ABUNDANCE, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "The kinetochore pool is not sufficient and whole-cell abundance is required, which returns the route to CV_BUBR1_ABUNDANCE with its actuators already enumerated"}
  - {id: T_POOL01_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_FOLD_INTRINSIC, kind: terminal, terminal: PHYSICALLY_INCOMPATIBLE_WITH_EVIDENCE, label: "The protein cannot be made native by assisting folding: abundance and nativeness are not separable for this substrate"}
  - {id: T_FOLD01_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_LIMFN01_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_COMPOSITE_INTRINSIC, kind: terminal, terminal: PHYSICALLY_INCOMPATIBLE_WITH_EVIDENCE, label: "The component set conflicts in every reachable configuration"}
  - {id: T_COMPOSITE02_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_ACT_CHRONIC_UNSAFE, kind: terminal, terminal: UNSAFE, label: "Arrest competence can only be supplied chronically, and chronic checkpoint activation causes myelosuppression and gastrointestinal atrophy in vivo. This closes the variable in its sustained form on evidence about the variable, not about one actuator"}
  - {id: T_ACT_EXHAUSTED, kind: terminal, terminal: SEARCHED_EXTERNAL_UNIVERSE_EXHAUSTED, label: "No way to supply arrest competence survived three search depths and a mechanistic-handle test"}
  - {id: T_ACT02_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_CLEAR_DEPLETES, kind: terminal, terminal: UNSAFE, label: "Selective elimination lowers the aneuploid fraction by depleting the population: the confounder B08 and B18 exist to catch, arriving as the mechanism rather than as an artefact"}
  - {id: T_CLEAR_NULL, kind: terminal, closes: CONTEXT, closes_for: CV_ANEUPLOID_CELL_FRACTION, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "No selective elimination of aneuploid cells is inducible in this context"}
  - {id: T_CLEAR01_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  # Re-audited: "on any ASSESSABLE measure" is bounded by what this project may observe, not by what
  # is knowable. A governance boundary wearing the word scientific.
  - {id: T_CLINICAL_LINK_ABSENT, kind: terminal, closes: CONTEXT, terminal: GOVERNANCE_BLOCKED, label: "No clinical feature is linked to aneuploid burden on any measure this project may assess. The limit is what may be observed in this child, not what is knowable: unauthorised is not unlinked"}
  - {id: T_CLIN02_BLOCKED, kind: terminal, terminal: GOVERNANCE_BLOCKED, label: "Not assessable: no intervention or longitudinal observation in this child is authorised"}
  # Re-audited and retired. "Per-cell fidelity improved and the tissue fraction did not fall" is not a
  # frontier; it names a variable the map had no node for. A tissue fraction is set by division
  # fidelity AND by the relative proliferation and loss of the two populations.
  - {id: S_AGGREGATION_UNEXPLAINED, kind: state, state_class: KNOWLEDGE, label: "Fidelity improved and the tissue fraction did not fall: something other than per-division error rate is setting the fraction"}
  - {id: T_XSCALE03_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}

  # ================= new control variables, each with its own candidate and adjudication =================
  - {id: C_CELL_SIZE, kind: state, label: "Cell volume at mitotic entry: enlargement causes mitotic errors and aneuploidy, on an axis entirely outside the kinetochore"}
  - {id: C_ATTACH_TURNOVER, kind: state, label: "Attachment turnover: MCAK/Kif2C centromeric activity tunes k-fibre turnover, which is the rate at which attachment errors are corrected"}
  - {id: C_COHESION, kind: state, label: "Centromeric cohesion: the phenotype actually scored in these patients is premature chromatid separation, which is a cohesion readout"}

  - id: DEP_CELL_SIZE
    kind: branch
    dependency_outcomes: ['independent_of_bubr1', 'benefit_requires_residual_bubr1']
    dependency_tested: true
    dependency_basis: "the same graded-gradient design, which is why this branch cannot be answered from the published work"
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does reducing cell volume at mitotic entry lower missegregation in a BubR1-limiting state, and is the effect independent of residual BubR1?"
    why_unresolved: "The causal claim is made in cells evading senescence after CDK4/6 inhibition, not at limiting BubR1, and nothing connects the two. The variable is attractive precisely because it is off the kinetochore axis, which also means no published experiment has reason to have tested it here."
    evidence: ["PMID:PPR1045515"]
    outcomes:
      independent_of_bubr1:              S_MIS_LOWERED_INDEPENDENT
      benefit_requires_residual_bubr1:   S_MIS_LOWERED_COMPENSATORY
      no_reduction:                      T_CELL_SIZE_NULL
      unestablished:                     T_CELL_SIZE_FRONTIER

  - id: DEP_ATTACH_TURNOVER
    kind: branch
    dependency_outcomes: ['independent_of_bubr1', 'benefit_requires_residual_bubr1']
    dependency_tested: true
    dependency_basis: "the same graded-gradient design"
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does tuning attachment turnover lower missegregation at limiting BubR1?"
    why_unresolved: "BubR1 works through PP2A-B56 on the same attachments, so this variable may not be independent of it — but it has its own actuators and its own readouts, and the dependency has never been tested. It is also the variable LIMFN01 would reach for."
    evidence: ["PMID:42256274", "PMID:34853300"]
    outcomes:
      independent_of_bubr1:              S_MIS_LOWERED_INDEPENDENT
      benefit_requires_residual_bubr1:   S_MIS_LOWERED_COMPENSATORY
      no_reduction:                      T_TURNOVER_NULL
      unestablished:                     T_TURNOVER_FRONTIER

  - id: DEP_COHESION
    kind: branch
    dependency_outcomes: ['benefit_requires_residual_bubr1']
    dependency_tested: true
    dependency_basis: "the same graded-gradient design, applied to PCS and missegregation together"
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does strengthening centromeric cohesion reduce premature chromatid separation and missegregation at limiting BubR1?"
    why_unresolved: "No route in this map addressed cohesion, although PCS is the hallmark scored in these patients. Whether BubR1 insufficiency produces PCS through cohesion loss or through checkpoint failure is itself unresolved, and the two imply different routes."
    evidence: ["PMID:40437074", "PMID:30464155"]
    outcomes:
      pcs_and_missegregation_fall:        S_MIS_LOWERED_DEPENDENCY_UNTESTED
      benefit_requires_residual_bubr1:    S_MIS_LOWERED_COMPENSATORY
      pcs_falls_missegregation_unchanged: S_PCS_DECOUPLED
      no_effect:                          T_COHESION_NULL
      unestablished:                      T_COHESION_FRONTIER
  # Alignment improved is not missegregation lowered. The flux work measures both and they are not the
  # same number: lagging chromosomes arising from alignment defects often integrate into the main
  # nucleus, so the step from intermediate to endpoint has to be measured rather than assumed.
  - {id: S_ALIGN_IMPROVED_COMPENSATORY, kind: state, state_class: MECHANISTIC_INTERMEDIATE, label: "Chromosome alignment is improved at residual BubR1 by a compensatory route. Missegregation has not been measured"}
  - {id: S_COMPOSITE_COMPENSATORY, kind: state, label: "One function supplied and another compensated: a mixed composite that reaches the terminal endpoint without reproducing any single canonical route"}
  # Efficacy shown, dependency not tested. A route arrives here whenever it lowered missegregation
  # without the graded-BubR1 design that could say whether it needed the protein.
  - {id: S_MIS_LOWERED_DEPENDENCY_UNTESTED, kind: state, state_class: SYSTEM, label: "Missegregation is lowered and the route's dependence on residual BubR1 was not tested: positive efficacy is neutral with respect to independence"}
  - {id: S_PCS_DECOUPLED, kind: state, state_class: KNOWLEDGE, label: "Premature chromatid separation falls and missegregation does not: the hallmark scored in patients and the endpoint this map targets are different quantities, and which one the phenotype tracks becomes the question"}

  - id: COUPLING01
    kind: branch
    branch_role: OBSERVATION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Do premature chromatid separation and per-division missegregation move together in a BubR1-limiting state?"
    why_unresolved: "The map chose missegregation as its terminal cellular endpoint; the cytogenetics that diagnose these patients score PCS. Whether they are one quantity seen two ways was assumed, never measured."
    observation_note: "This is an observation. It changes which endpoint the city should track and nothing about the cell's state, so none of its outcomes may land on an improved biological state."
    outcomes:
      coupled:        S_ENDPOINTS_COUPLED
      decoupled:      S_PCS_DECOUPLED
      unestablished:  T_COUPLING_FRONTIER
  - {id: S_ENDPOINTS_COUPLED, kind: state, state_class: KNOWLEDGE, label: "PCS and missegregation move together in this system: a route that moves one is evidence about the other, and the current endpoint choice is safe"}

  - id: CLINLINK01
    kind: branch
    branch_role: OBSERVATION
    resolves_by: MEASUREMENT
    requires: ORGANISM_MODEL
    label: "Which cellular endpoint tracks the clinical phenotype — PCS, missegregation, or neither alone?"
    why_unresolved: "A cell model cannot answer this. Coupling in a dish says the two readouts agree there; it says nothing about which one the child's phenotype follows, and that needs organism-level or longitudinal data this project does not have."
    observation_note: "Observation, and at a scale no cell experiment reaches. Separated from COUPLING01 because conflating them would let a dish settle a clinical question."
    outcomes:
      pcs_tracks_phenotype:            S_ENDPOINT_IS_PCS
      missegregation_tracks_phenotype: S_ENDPOINT_IS_MIS
      neither_alone:                   S_ENDPOINT_COMPOSITE
      unestablished:                   T_CLINLINK_FRONTIER
  - {id: S_ENDPOINT_IS_PCS, kind: state, state_class: KNOWLEDGE, label: "The phenotype tracks premature chromatid separation: the cellular target needs a cohesion endpoint the current conjunction does not contain"}
  - {id: S_ENDPOINT_IS_MIS, kind: state, state_class: KNOWLEDGE, label: "The phenotype tracks per-division missegregation: the city's existing endpoint choice is vindicated"}
  - {id: S_ENDPOINT_COMPOSITE, kind: state, state_class: KNOWLEDGE, label: "Neither cellular endpoint alone tracks the phenotype: the cellular target needs a composite the current conjunction does not contain"}

  - id: MIS_MEASURE01
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does the improved alignment translate into fewer missegregation events per assessable division?"
    why_unresolved: "The transition from a canonical intermediate to the terminal endpoint is a measurement, not an entailment. The flux work found the chain leaky in the other direction — lagging chromosomes from alignment defects often integrate into the main nucleus — so the step cannot be inferred."
    evidence: ["PMID:39541344"]
    establishes: "missegregation per assessable division, with its denominator"
    outcomes:
      missegregation_falls:        S_MIS_LOWERED_DEPENDENCY_UNTESTED
      alignment_only:              S_INTERMEDIATE_DECOUPLED
      unestablished:               T_MIS_MEASURE_FRONTIER
  - {id: S_INTERMEDIATE_DECOUPLED, kind: state, state_class: KNOWLEDGE, label: "Alignment improved and missegregation did not: for this state the canonical intermediate is not the limiting quantity, which is what LIMFN01 asks next"}

  # ================= cross-family combinations =================
  - id: COMBO_F1_F2
    kind: branch
    dependency_outcomes: ['combination_sufficient']
    dependency_tested: true
    dependency_basis: "by construction — this route includes partial protein restoration or an exploited residual function, so it is BubR1-dependent by design rather than by measurement"
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does a partial abundance gain plus an independently supplied function reach the state where neither does alone?"
    why_unresolved: "The families were enumerated as alternatives. A supplied function may need less of it when some residual protein is restored, and a partial restoration may need less supplied function. Neither direction is tested."
    outcomes:
      combination_sufficient: S_MIS_LOWERED_COMPENSATORY
      still_insufficient:     T_F1F2_INSUFFICIENT
      combination_harmful:    T_UNSAFE_COMBO
      unestablished:          T_F1F2_FRONTIER
  - id: COMBO_F2_F3
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does supplying one function while compensating another through a different physical process reach the state?"
    why_unresolved: "The functions are separable, so a composite need not supply all of them the same way. A supplied alignment component plus a compensatory silencing route is untested, as is the converse."
    outcomes:
      combination_sufficient: S_COMPOSITE_COMPENSATORY
      functions_conflict:     S_COMPOSITE_CONFLICTED
      still_insufficient:     T_F2F3_INSUFFICIENT
      unestablished:          T_F2F3_FRONTIER
  - id: COMBO_F3_F4
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: TISSUE_MODEL
    label: "Does lowering the error rate while promoting clearance of cells that already carry errors move the tissue fraction where neither does alone?"
    why_unresolved: "Clearance alone depletes a population that keeps generating errors; error reduction alone leaves the established burden. Together the arithmetic is different, and nothing has run them together."
    outcomes:
      combination_sufficient:   S_TISSUE_FRACTION_FALLS
      population_depleted:      T_CLEAR_DEPLETES
      still_insufficient:       T_F3F4_INSUFFICIENT
      unestablished:            T_F3F4_FRONTIER
  - id: COMBO_F1_F4
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: TISSUE_MODEL
    label: "Does partial protein restoration plus clearance of already-aneuploid cells move the tissue fraction?"
    why_unresolved: "Same arithmetic as F3+F4 with a different error-reduction mechanism, and it is the only combination that touches both the prospective and the established burden."
    outcomes:
      combination_sufficient: S_TISSUE_FRACTION_FALLS
      population_depleted:    T_CLEAR_DEPLETES
      still_insufficient:     T_F1F4_INSUFFICIENT
      unestablished:          T_F1F4_FRONTIER

  # ================= context boundaries, by lattice dimension =================
  - id: XFER_LINEAGE
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does the effect hold in a lineage relevant to this child's phenotype, rather than in a cancer line?"
    why_unresolved: "Every result in this map comes from HeLa, U2OS or RPE-1. The phenotype is multi-system, so the relevant lineage is not one cell type, and iPSC-derived lineages are a route that needs no patient material."
    outcomes:
      holds_in_relevant_lineage: S_XFER_OK
      lineage_specific_failure:  S_LINEAGE_DEPENDENT
      unestablished:             T_XFER_LINEAGE_FRONTIER
  - {id: S_LINEAGE_DEPENDENT, kind: state, state_class: KNOWLEDGE, label: "The effect is lineage-dependent: it works in some relevant lineages and not others, which makes tissue selectivity a design variable rather than a confound"}
  - id: XFER_DEVSTATE
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: TISSUE_MODEL
    label: "Does the effect hold in a developmental state resembling when the burden is laid down?"
    why_unresolved: "The burden is largely developmental and the experiments are in adult-derived, transformed or immortalised cells. Developmental state is a lattice dimension the map has carried as a single undifferentiated transfer question."
    outcomes:
      holds_developmentally: S_XFER_OK
      adult_only:            S_DEV_WINDOW_MISSED
      unestablished:         T_XFER_DEV_FRONTIER
  - {id: S_DEV_WINDOW_MISSED, kind: state, state_class: KNOWLEDGE, label: "The effect holds only in adult-like states: the developmental window in which the burden accrues is not addressable by this route, which bounds it to the prospective component"}

  - {id: T_MIS_MEASURE_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Whether the intermediate translates to the endpoint is unestablished; the measurement is specified and unrun"}
  - {id: T_DEPTEST_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "The gradient was not achieved or not measured: dependency stays untested"}
  - {id: T_CELL_SIZE_NULL, kind: terminal, closes: ACTUATOR, closes_for: CV_CELL_SIZE, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Cell volume does not move missegregation in this state"}
  - {id: T_NEXT_ACTUATOR_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Engagement of the next actuator not validated: repeat"}
  - {id: T_NEXT_CONFIG_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Configuration not achieved as specified: repeat"}
  - {id: T_CELL_SIZE_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_TURNOVER_NULL, kind: terminal, closes: ACTUATOR, closes_for: CV_ATTACHMENT_TURNOVER, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Attachment turnover does not move missegregation in this state"}
  - {id: T_TURNOVER_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_COHESION_NULL, kind: terminal, closes: ACTUATOR, closes_for: CV_COHESION_PROTECTION, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Cohesion protection moves neither PCS nor missegregation here"}
  - {id: T_COHESION_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_COUPLING_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Whether PCS and missegregation are coupled is unestablished; the comparison is specified and unrun"}
  - {id: T_CLINLINK_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Which endpoint tracks the phenotype is unestablished, and no authorised observation can currently settle it"}
  - {id: T_F1F2_INSUFFICIENT, kind: terminal, closes: CONFIGURATION, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Partial repair plus a supplied function is still insufficient"}
  - {id: T_F1F2_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_F2F3_INSUFFICIENT, kind: terminal, closes: CONFIGURATION, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Supply plus compensation is still insufficient"}
  - {id: T_F2F3_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_F3F4_INSUFFICIENT, kind: terminal, closes: CONFIGURATION, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Error reduction plus clearance does not move the tissue fraction"}
  - {id: T_F3F4_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_F1F4_INSUFFICIENT, kind: terminal, closes: CONFIGURATION, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Partial repair plus clearance does not move the tissue fraction"}
  - {id: T_F1F4_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_XFER_LINEAGE_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat in a relevant lineage"}
  - {id: T_XFER_DEV_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat in a developmental model"}

  - id: DEPTEST01
    kind: branch
    dependency_outcomes: ['independent_across_gradient', 'scales_with_residual_bubr1']
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does the demonstrated benefit survive across a graded BubR1 gradient, and is it therefore independent of residual protein or compensatory?"
    why_unresolved: "Shared by every route that showed efficacy without testing dependency. A single limiting condition cannot answer it; the claim is licensed by the gradient, which is why this is one reusable node rather than a clause inside each candidate's branch."
    dependency_tested: true
    dependency_basis: "this branch IS the gradient design — a graded BubR1 series with the perturbation held constant, which is the only thing that licenses an independence claim"
    outcomes:
      independent_across_gradient: S_MIS_LOWERED_INDEPENDENT
      scales_with_residual_bubr1:  S_MIS_LOWERED_COMPENSATORY
      absent_at_limiting_end:      S_FLUX_NEEDS_MORE_BUBR1
      unestablished:               T_DEPTEST_FRONTIER

  - id: NEXT_ACTUATOR01
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does another actuator of the same control variable move it, where the one tested did not?"
    why_unresolved: "One shared node rather than one per variable, because the question has the same shape every time: a null on an actuator closes that actuator. Every control variable in this map has more than one identified actuator, and none has had them all tried."
    preserves_variable_identity: true
    identity_note: "The question structure is shared; the biology is not. A working alternate actuator
      returns to the state its own variable produces — an alignment actuator returns to alignment, an
      abundance actuator to abundance — never to a generic improvement. Merging the shapes was right;
      merging the landings would have let a cohesion null resolve into an alignment claim."
    actuator_retry_map:
      CV_CHROMOSOME_ALIGNMENT: alignment_actuator_works
      CV_CHECKPOINT_SILENCING: silencing_actuator_works
      CV_BUBR1_ABUNDANCE: abundance_actuator_works
      CV_CELL_SIZE: error_rate_actuator_works
      CV_ATTACHMENT_TURNOVER: error_rate_actuator_works
      CV_COHESION_PROTECTION: error_rate_actuator_works
    outcomes:
      alignment_actuator_works:  S_ALIGN_IMPROVED_COMPENSATORY
      silencing_actuator_works:  S_SIL_SUPPLIED
      abundance_actuator_works:  S_REF_STABILISABLE
      error_rate_actuator_works: S_MIS_LOWERED_VIA_ALTERNATE
      all_actuators_exhausted:   S_CV_CLOSED_ON_EVIDENCE
      unestablished:             T_NEXT_ACTUATOR_FRONTIER
  - {id: S_MIS_LOWERED_VIA_ALTERNATE, kind: state, state_class: SYSTEM, label: "Missegregation is lowered by an alternative actuator of an error-rate variable, or by an alternative configuration, after the first one failed; dependency is still untested"}
  - {id: S_CV_CLOSED_ON_EVIDENCE, kind: state, state_class: KNOWLEDGE, label: "Every identified actuator of this control variable has been tried with engagement validated and none moved it: the variable, not an actuator, is now closed on evidence"}

  - id: NEXT_CONFIG01
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does another configuration of the same combination — different ratio, order or timing — reach the state where the one tested did not?"
    why_unresolved: "A combination verdict closes the configuration that was run. Stoichiometry, order and temporal separation are all unexplored, and TRIP13's temporally separable roles are the existence proof that configuration matters."
    outcomes:
      another_configuration_works: S_MIS_LOWERED_VIA_ALTERNATE
      configuration_space_exhausted: S_COMBINATION_CLOSED
      unestablished:                 T_NEXT_CONFIG_FRONTIER
  - {id: S_COMBINATION_CLOSED, kind: state, state_class: KNOWLEDGE, label: "The reachable configuration space of this combination is exhausted: the combination, not one configuration, is closed"}


  # ================= neighbourhood: CHAR01 = not_destabilised =================
  # One road ran through this district. If the protein is present at normal level and the cell still
  # misbehaves, the defect is not abundance — and nothing downstream of the abundance premise applies.
  - id: FUNCDEF01
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "With abundance normal, which function is defective — checkpoint activation, silencing, alignment, or none of them?"
    why_unresolved: "The abundance premise was the map's organising assumption, so the world where it is false had one road through it. A normally expressed allele with a cellular phenotype is the Y155C regime, where the defect is in a specific function and the domain predicts which."
    evidence: ["PMID:20516114"]
    outcomes:
      activation_only:    S_DEFECT_IS_ACTIVATION
      silencing_only:     S_DEFECT_IS_SILENCING
      alignment_only:     S_DEFECT_IS_ALIGNMENT
      more_than_one:      S_DEFECT_IS_COMPOSITE
      no_defect_found:    S_NO_CELLULAR_DEFECT
      unestablished:      T_FUNCDEF_FRONTIER
  - {id: S_DEFECT_IS_ACTIVATION, kind: state, state_class: KNOWLEDGE, label: "Abundance normal, checkpoint activation defective: a separation-of-function allele of the Y155C kind, and the route needs activation supplied or compensated rather than protein stabilised"}
  - {id: S_DEFECT_IS_SILENCING, kind: state, state_class: KNOWLEDGE, label: "Abundance normal, silencing defective: the route needs the silencing variable, and TRIP13/APC15 is its named actuator"}
  - {id: S_DEFECT_IS_ALIGNMENT, kind: state, state_class: KNOWLEDGE, label: "Abundance normal, alignment defective: the central-region function is impaired in a protein that is present, which is the 483X pattern"}
  - {id: S_DEFECT_IS_COMPOSITE, kind: state, state_class: KNOWLEDGE, label: "Abundance normal, more than one function defective in a present protein: composite replacement or compensation, with no stabilisation route to fall back on"}
  - {id: S_NO_CELLULAR_DEFECT, kind: state, state_class: KNOWLEDGE, label: "Abundance normal and no cellular defect in this construct: either the construct does not reproduce the allele's behaviour, or the phenotype arises from something this assay does not see"}

  - id: CONSTRUCT01
    kind: branch
    branch_role: OBSERVATION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does the construct reproduce the allele's behaviour at all, or is the null a property of the model?"
    why_unresolved: "A normally expressed allele with no measurable defect is the one result that indicts the assay rather than the biology. Tag placement, isoform choice and the absence of the second allele are all candidate explanations, and none has been excluded."
    observation_note: "Observation about the model, not about the cell. Its outcomes are knowledge only."
    outcomes:
      construct_is_faithful:     S_PHENOTYPE_ELSEWHERE
      construct_is_the_problem:  S_CONSTRUCT_ARTEFACT
      unestablished:             T_CONSTRUCT_FRONTIER
  - {id: S_PHENOTYPE_ELSEWHERE, kind: state, state_class: KNOWLEDGE, label: "The construct is faithful and shows no defect: the phenotype arises outside what a single-allele replacement assay measures — the compound-heterozygous combination, a non-mitotic role, or a tissue context"}
  - {id: S_CONSTRUCT_ARTEFACT, kind: state, state_class: KNOWLEDGE, label: "The construct does not reproduce the allele: every result that used it is uninterpretable, including the destabilisation reading"}

  - id: GENOTYPE01
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does the compound-heterozygous combination produce a defect that neither allele produces alone?"
    why_unresolved: "Every experiment in this map replaces one allele. The child has two, and the truncating one contributes little full-length protein but is not nothing. An interaction would be invisible to every single-allele design here."
    outcomes:
      combination_defect:    S_DEFECT_IS_COMPOSITE
      no_interaction:        S_PHENOTYPE_UNLOCATED
      unestablished:         T_GENOTYPE_FRONTIER

  # ================= neighbourhood: tissue and organism =================
  - id: DELIVERY01
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: ORGANISM_MODEL
    label: "Can the actuator reach the lineages that carry the burden, at the time they carry it?"
    why_unresolved: "Every route in this map ends at a dish. Reaching a tissue is a separate physical problem from moving a cellular variable, and no actuator in the map has a delivery record."
    outcomes:
      reaches_relevant_lineages: S_DELIVERY_FEASIBLE
      reaches_some_lineages:     S_DELIVERY_PARTIAL
      cannot_reach:              T_DELIVERY_ABSENT
      unassessable:              T_DELIVERY_BLOCKED
  - {id: S_DELIVERY_FEASIBLE, kind: state, state_class: SYSTEM, label: "The actuator reaches the lineages that carry the burden"}
  - {id: S_DELIVERY_PARTIAL, kind: state, state_class: SYSTEM, label: "Some lineages are reachable and others are not: tissue selectivity becomes a design variable, and which lineages matter becomes the question"}

  - id: LINEAGE_WEIGHT01
    kind: branch
    branch_role: OBSERVATION
    resolves_by: MEASUREMENT
    requires: ORGANISM_MODEL
    label: "Which lineages' aneuploid burden accounts for which clinical features?"
    why_unresolved: "The phenotype is multi-system and the burden is mosaic, so burden and feature are not uniformly related across tissues. Nothing in this project maps one onto the other, and partial delivery makes the mapping decision-relevant rather than academic."
    observation_note: "Observation at organism scale; its outcomes are knowledge about which tissues matter."
    outcomes:
      a_dominant_lineage_exists: S_LINEAGE_PRIORITY_KNOWN
      burden_is_distributed:     S_BURDEN_DISTRIBUTED
      unestablished:             T_LINEAGE_WEIGHT_FRONTIER
  - {id: S_LINEAGE_PRIORITY_KNOWN, kind: state, state_class: KNOWLEDGE, label: "One or a few lineages dominate the clinical burden: partial delivery may be sufficient, and tissue selectivity becomes a target rather than a limitation"}
  - {id: S_BURDEN_DISTRIBUTED, kind: state, state_class: KNOWLEDGE, label: "The burden is distributed across lineages: partial delivery cannot be sufficient, and the organism route needs breadth the cellular route never had to supply"}

  - id: WINDOW01
    kind: branch
    branch_role: OBSERVATION
    resolves_by: MEASUREMENT
    requires: ORGANISM_MODEL
    label: "Is there a developmental window in which acting would change the accrued burden, and is any part of it still ahead of this child?"
    why_unresolved: "IRREV01 asks whether a prospective component exists; this asks when it is. A window that closed before diagnosis and a window that is continuous are different situations with different routes, and nothing distinguishes them."
    observation_note: "Observation; knowledge about timing, not a change to the system."
    outcomes:
      window_is_open:        S_WINDOW_OPEN
      window_has_closed:     S_ESTABLISHED_BURDEN
      burden_accrues_continuously: S_WINDOW_CONTINUOUS
      unestablished:         T_WINDOW_FRONTIER
  - {id: S_WINDOW_OPEN, kind: state, state_class: KNOWLEDGE, label: "A developmental window is still open: the prospective component is bounded in time and acting within it is the route"}
  - {id: S_WINDOW_CONTINUOUS, kind: state, state_class: KNOWLEDGE, label: "The burden accrues continuously rather than in a window: there is no deadline, and a sustained route is both possible and necessary"}

  - {id: T_FUNCDEF_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Which function is defective is unestablished; the panel is specified and unrun"}
  - {id: T_CONSTRUCT_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Construct fidelity unestablished: repeat with the controls named"}
  # Re-audited and retired. Every assay in this map is mitotic, in one cell type, in adult-derived
  # cells. A phenotype those cannot see is a statement about the assays' context, not about biology.
  - {id: S_PHENOTYPE_UNLOCATED, kind: state, state_class: KNOWLEDGE, label: "Abundance normal, no single-allele defect, no allele interaction, faithful construct: the phenotype is outside what a mitotic single-lineage adult-derived assay can see"}
  - {id: T_GENOTYPE_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Allele interaction unestablished; the two-allele design is specified and unrun"}
  - {id: T_DELIVERY_ABSENT, kind: terminal, closes: ACTUATOR, terminal: SEARCHED_EXTERNAL_UNIVERSE_EXHAUSTED, label: "No route reaches the relevant lineages for this actuator. Actuator-scoped: a different actuator may have a different delivery profile"}
  - {id: T_DELIVERY_BLOCKED, kind: terminal, terminal: GOVERNANCE_BLOCKED, label: "Delivery is not assessable: no intervention in this child is authorised"}
  - {id: T_LINEAGE_WEIGHT_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "The burden-to-feature mapping is unestablished and needs organism-level data this project does not hold"}
  - {id: T_WINDOW_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "The developmental window is unestablished; natural-history data would settle it"}

  # ---- the variable T_AGGREGATION_UNEXPLAINED was hiding ----
  - id: DEP_CLONAL_DYNAMICS
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: TISSUE_MODEL
    label: "Is the tissue aneuploid fraction set by the relative proliferation and loss of euploid versus aneuploid populations rather than by the per-division error rate?"
    why_unresolved: "The map modelled the fraction as an aggregate of per-division fidelity. A fraction is a ratio, and a ratio moves when either population's growth or death rate moves. Nothing here measured those, which is why improving fidelity without moving the fraction looked like a contradiction instead of a missing variable."
    outcomes:
      clonal_dynamics_dominate: CV_CLEARANCE_ENTRY
      fidelity_dominates_after_all: T_AGGREGATION_IRRECONCILABLE
      unestablished:            T_CLONAL_FRONTIER

  # ---- the context dimension T_PHENOTYPE_UNLOCATED was hiding ----
  - id: NONMITOTIC01
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does the allele impair a non-mitotic role, which a mitotic assay would not see?"
    why_unresolved: "BubR1 is studied here only in mitosis, and every readout in this map is a mitotic one. A defect outside mitosis is invisible by construction, not by evidence."
    outcomes:
      non_mitotic_defect_found: S_DEFECT_IS_COMPOSITE
      mitotic_only:             S_PHENOTYPE_NEEDS_CONTEXT
      unestablished:            T_NONMITOTIC_FRONTIER
  - {id: S_PHENOTYPE_NEEDS_CONTEXT, kind: state, state_class: KNOWLEDGE, label: "The allele's effect is mitotic and still unseen in these cells: what remains is the context dimensions — lineage and developmental state — rather than another mitotic assay"}

  - {id: T_AGGREGATION_IRRECONCILABLE, kind: terminal, closes: NO_NEXT_STEP, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Clonal dynamics do not explain it and fidelity does dominate, yet the fraction does not move: a contradiction between two measurements with no identified next experiment. The one genuine scientific frontier of the three re-audited"}
  - {id: T_CLONAL_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Population growth and loss rates not measured: repeat with both populations tracked"}
  - {id: T_NONMITOTIC_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Non-mitotic roles not assayed; the question is specified and unrun"}

edges:
  # forward reachability from the case state
  # The disease state is observed, not inferred from a mechanism: the child has mosaic variegated
  # aneuploidy whatever the reason for the protein level. This edge is what makes the bypass family
  # independent of CHAR01 — a component that supplies a lost function does not care why BubR1 is low.
  - {from: S0_CASE, to: S_MISSEGREGATION, label: GROUNDED, note: "Observed phenotype: random aneuploidies and elevated premature chromatid separation, confirmed cytogenetically"}
  - {from: S0_CASE, to: S_CLASS_PREMISE, label: GROUNDED, note: "The missense allele sits in the protein kinase domain, from the case's own protein-feature evidence", evidence: [mechanism_run_RUN_20261005T142213Z_dd4b1e]}
  - {from: S_CLASS_PREMISE, to: CHAR01, label: EXPERIMENTAL_UNKNOWN, note: "The class premise has never been tested on this allele. This is the transfer every abundance route silently assumes"}
  - {from: S_ABUNDANCE_LOW, to: S_MISSEGREGATION, label: CONTEXT_TRANSFER_REQUIRED, note: "Direction grounded by doxycycline titration (~6% of wild-type missegregates in most cells, ~13% is near-normal); the magnitude was measured with normal protein in HeLa and does not transfer", evidence: ["PMID:20516114"]}
  - {from: S_ABUNDANCE_LOW_OTHER, to: EXP01, label: EXPERIMENTAL_UNKNOWN, note: "Function at matched abundance is still the right question; only the stabilisation mechanism grounding is lost"}
  # The disease state is not a dead end: both families leave from it, and the bypass family does not
  # wait on EXP01. Nothing about supplying a lost function independently depends on first learning
  # whether the child's own protein would work at matched abundance.
  - {from: S_MISSEGREGATION, to: C_CENPE, label: GROUNDED, note: "CENP-E is required for congression of polar chromosomes", evidence: ["PMID:41120314"]}
  - {from: S_MISSEGREGATION, to: C_KIF18A, label: GROUNDED, note: "KIF18A promotes congression, from a genome-wide screen", evidence: ["PMID:41218610"]}
  - {from: S_MISSEGREGATION, to: C_FLUX, label: GROUNDED, note: "Poleward flux reported as a target for modifying segregation errors", evidence: ["PMID:39541344"]}
  - {from: S_MISSEGREGATION, to: C_TRIP13, label: GROUNDED, note: "TRIP13 and APC15 drive mitotic exit by MCC turnover", evidence: ["PMID:30341343"]}
  - {from: S_MISSEGREGATION, to: BYPASS_ACT, label: PHYSICAL_ACTUATOR_MISSING, note: "No named candidate survived function-first discovery for checkpoint activation; available from the current state and independent of EXP01's result"}
  # CENP-E is closed by evidence rather than left unresolved: it has a BubR1-independent route to the
  # outer corona, and the mechanism by which it initiates congression is explicitly BubR1-dependent.
  # Localisation is not function — the same distinction Y155C forces.
  # Adjudicated at figure level, because a branch-closing claim is load-bearing. Fig. 6f: CENP-E
  # reactivation in BubR1-depleted cells did not trigger congression of polar chromosomes. Fig. 5c:
  # Aurora B inhibition in cells lacking both CENP-E activity and BubR1 blocked congression
  # completely, so BubR1's requirement is independent of its CENP-E-recruitment role and cannot be
  # compensated by inhibiting Aurora kinases. PMID:38354735's BubR1-independent pathway is measured
  # purely as CENP-E intensity relative to CENP-C — localisation, with no functional readout.
  - {from: C_CENPE, to: S_CENPE_BUBR1_DEPENDENT, label: GROUNDED, note: "Fig. 6f and Fig. 5c of PMID:41120314; the BubR1-independent route of PMID:38354735 is localisation only", evidence: ["PMID:41120314", "PMID:38354735"]}
  - {from: C_KIF18A, to: DEP_KIF18A, label: EXPERIMENTAL_UNKNOWN}
  - {from: C_FLUX, to: DEP_FLUX, label: EXPERIMENTAL_UNKNOWN}
  - {from: C_TRIP13, to: DEP_TRIP13, label: EXPERIMENTAL_UNKNOWN}
  # Normal abundance excludes a simple low-abundance explanation. It does not say which function is
  # broken, or that more than one is: Y155C is normally expressed and loses exactly one.
  - {from: S_ABUNDANCE_NORMAL, to: EXP01, label: EXPERIMENTAL_UNKNOWN, note: "Routes to exact functional characterisation; the matching requirement is already satisfied, so EXP01 reads as a direct function test", evidence: ["PMID:20516114"]}
  # the abundance family
  - {from: S_ABUNDANCE_LOW, to: EXP01, label: EXPERIMENTAL_UNKNOWN}
  - {from: S_FUNCTION_OK, to: S_MATCHED_ACHIEVABLE, label: GROUNDED, note: "EXP01 returning full function entails matched abundance was achieved, which is its own gate"}
  - {from: S_MATCHED_ACHIEVABLE, to: STAB01, label: PHYSICAL_ACTUATOR_MISSING, note: "Ectopic matching is a laboratory condition, not a control the case can hold. A physical actuator is required and none is grounded"}
  - {from: S_REF_STABILISABLE, to: STAB02, label: EXPERIMENTAL_UNKNOWN}
  - {from: S_CASE_STABILISABLE, to: FUNCVAL01, label: EXPERIMENTAL_UNKNOWN}
  - {from: S_STABILISED_FUNCTIONAL, to: XFER01, label: CONTEXT_TRANSFER_REQUIRED}
  - {from: S_XFER_OK, to: F1_COMPLETE, label: GROUNDED, note: "AND-node member"}
  # The population endpoints are gates on outcome assignment, not separate route steps: EXP01 assigns
  # no functional outcome unless viability, death and division are valid, so a route that reaches a
  # functional state has observed them in the same experiment rather than assuming them.
  - {from: S_FUNCTION_OK, to: S_POP_SAFE_F1, label: GROUNDED, note: "Observed by EXP01's required safety readouts, which gate its own outcome assignment"}
  - {from: S_ALIGN_SUPPLIED, to: SAFE01, label: EXPERIMENTAL_UNKNOWN, note: "A bypass component has no safety record at all, so population safety is a branch rather than an inherited property"}
  - {from: F1_COMPLETE, to: CANONICAL_CELLULAR_STATE, label: CONCEPTUALLY_SUFFICIENT_ONLY, note: "Restoring abundance of a functional protein in the relevant cell is sufficient in model. Population endpoints (viability, division, death) must still be observed, never assumed"}
  - {from: B_TURNOVER_ONLY, to: STAB01, label: EXPERIMENTAL_UNKNOWN, reentry: true, note: "Re-enters STAB01 on the folding-capacity arm (P1-R) rather than the degradative arm. A deliberate loop: the same branch node asked of a different arm"}
  # negative EXP01 branches route into the bypass family
  - {from: B_ALIGN_DEFECT, to: C_KIF18A, label: GROUNDED, note: "Alignment must be supplied independently. The requirement is grounded (central region 484-715); the component is not"}
  - {from: B_SIL_DEFECT, to: C_TRIP13, label: GROUNDED}
  - {from: B_SEG_DEFECT, to: C_KIF18A, label: CONCEPTUALLY_SUFFICIENT_ONLY, note: "Segregation fidelity is downstream of alignment and checkpoint; a segregation-only defect is addressed through whichever upstream function is failing"}
  - {from: B_MULTI_DEFECT, to: C_KIF18A, label: GROUNDED, note: "Composite replacement: each lost function must be supplied, and the functions are separable, so they must be supplied separately", evidence: ["PMID:20516114"]}
  - {from: B_MULTI_DEFECT, to: C_TRIP13, label: GROUNDED}
  - {from: B_MULTI_DEFECT, to: BYPASS_ACT, label: PHYSICAL_ACTUATOR_MISSING}
  # Failing to express an allele in one construct is an expression-validity result before it is a
  # biological one. It opens stabilisation and bypass; it does not close the abundance family.
  - {from: S_NOT_EXPRESSIBLE, to: STAB01, label: EXPERIMENTAL_UNKNOWN, note: "Can the protein be held up at all? A stabilising perturbation may raise what a promoter could not"}
  # An established ceiling is still not the end of the abundance family: expression and stabilisation
  # are different levers, and a protein that a promoter cannot raise may still be one a chaperone or
  # degradation perturbation can.
