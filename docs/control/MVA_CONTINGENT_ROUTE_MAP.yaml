# ============================ analysis pass: motif-derived hypotheses ============================
# Separate from the city by construction. Motifs are patterns in the graph; a pattern is a reason to
# ask a question, never a reason to draw an edge. Every entry here is NOT_TRAVERSABLE: the compiler
# ignores this block entirely, so nothing below can shorten a route or close a branch until it is
# grounded and promoted into `edges` by hand.
#
# Two kinds are distinguished. A STRUCTURAL hypothesis is a claim about this graph and is verifiable
# by reading it. A BIOLOGICAL hypothesis is a claim about the world and needs evidence or an
# experiment before it may be believed, let alone traversed.
hypotheses:
  - id: H_M1_SHARED_PLATFORM
    kind: STRUCTURAL
    motif: "shared prerequisite"
    claim: "Nine branches require the same thing before any of them can be asked: a human-cell system
      held at measured, limiting BubR1 with missegregation readouts. DEP_KIF18A, DEP_FLUX, CENPE_F3,
      TRIP13_F3, POOL01, LIMFN01, DEP_CELL_SIZE, DEP_ATTACH_TURNOVER and DEP_COHESION all sit behind it."
    consequence: "The expensive object in this map is not any experiment; it is the platform, and it is
      shared. A view that ranked experiments individually would never surface this."
    status: NOT_TRAVERSABLE
    what_would_promote_it: "Nothing — it is a statement about the graph, not about biology, and it is
      already checked by a test. It is recorded here because it is an analysis output, not a route."
  - id: H_M2_ISOMORPHIC_ADJUDICATION
    kind: STRUCTURAL
    motif: "repeated subgraph"
    claim: "Three dependency branches share an identical four-outcome signature (independent /
      compensatory / no_reduction / unestablished) and three F3 branches share a three-outcome
      signature. The shape repeats with only the candidate swapped."
    consequence: "One experimental design, parameterised by candidate, resolves a whole class of
      branches. The repetition is the point rather than redundancy to be collapsed."
    status: NOT_TRAVERSABLE
  - id: H_M3_FLUX_AND_TURNOVER_MAY_BE_ONE_VARIABLE
    kind: BIOLOGICAL
    motif: "disjoint actuators on a shared physical substrate"
    claim: "CV_POLEWARD_FLUX and CV_ATTACHMENT_TURNOVER are modelled as separate variables with
      disjoint actuators, yet both act on the kinetochore fibre: flux is k-fibre flux, and MCAK/Kif2C
      centromeric activity tunes k-fibre turnover. They may be one control variable observed through
      two readouts."
    consequence: "If one variable, the two neighbourhoods merge and the apparent breadth of the F2/F3
      candidate set shrinks. If two, they are independent levers and a combination becomes meaningful."
    status: NOT_TRAVERSABLE
    what_would_promote_it: "An experiment moving one readout while holding the other, in the same
      system: tune MCAK/Kif2C and measure flux rate and overlap length, or slow flux and measure
      k-fibre turnover. Until then the map keeps them separate, which is the conservative choice
      because merging would delete branches."
    evidence_so_far: ["PMID:39541344", "PMID:42256274"]
  - id: H_M4_F3_MAY_RUN_THROUGH_ATTACHMENT_TURNOVER
    kind: BIOLOGICAL
    motif: "cross-family bridge through a shared mechanism class"
    claim: "The F3 routes exploit residual BubR1, and BubR1 acts on attachments through PP2A-B56.
      CV_ATTACHMENT_TURNOVER's actuators include Astrin-PP1. Both are phosphatase-mediated attachment
      protection, so CENPE_F3, KIF18A_F3 and DEP_ATTACH_TURNOVER may be one route seen from three
      angles rather than three routes."
    consequence: "Would collapse three branches into one and explain why each is BubR1-dependent in the
      same way. Would also mean a single negative result closes more than it appears to."
    status: NOT_TRAVERSABLE
    what_would_promote_it: "Epistasis: whether the benefit of a boosted CENP-E or KIF18A survives when
      PP2A-B56 recruitment or Astrin-PP1 is held fixed."
    evidence_so_far: ["PMID:41120314", "PMID:34853300", "PMID:42256274"]
  - id: H_M5_COHESION_MAY_BE_THE_PROXIMAL_DEFECT
    kind: BIOLOGICAL
    motif: "endpoint mismatch between the map and the clinic"
    claim: "Premature chromatid separation is the hallmark scored in these patients, and PCS is a
      cohesion readout rather than a missegregation count. If cohesion loss is the proximal
      consequence of BubR1 insufficiency, then the alignment and checkpoint routes address a
      downstream symptom and CV_COHESION_PROTECTION is the primary variable."
    consequence: "Would reorder the whole city, not a route within it. It is the most consequential
      hypothesis here and the least examined."
    status: NOT_TRAVERSABLE
    what_would_promote_it: "ENDPOINT01: measure PCS and per-division missegregation in the same
      BubR1-limiting system and see whether they move together."
    evidence_so_far: ["PMID:40437074", "PMID:30464155", "PMID:42434306"]
  - id: H_M6_NO_SHARED_ACTUATORS
    kind: STRUCTURAL
    motif: "absent overlap"
    claim: "No actuator appears in more than one control variable across all nine."
    consequence: "There is no accidental two-for-one: a combination route needs a combination of
      perturbations, and no single intervention moves two variables. This is a negative motif and it
      constrains the combination branches rather than enabling them."
    status: NOT_TRAVERSABLE
  - id: H_M7_KIF18A_CONVERGENCE_IS_A_WIRING_ARTEFACT
    kind: STRUCTURAL
    motif: "false convergence"
    claim: "C_KIF18A has the highest inbound count in the graph (eight), above both genuine convergence
      basins. That is not biological importance: several defect and ceiling states were wired to it
      because it was the nearest remaining alignment candidate."
    consequence: "Recorded so a later leverage pass does not mistake it for a hub. The real basins are
      S_MIS_LOWERED_COMPENSATORY and S_MIS_LOWERED_INDEPENDENT, which many distinct routes reach on
      their own merits."
    status: NOT_TRAVERSABLE
    what_would_promote_it: "Nothing. It is a caveat on the graph, and acting on it means re-examining
      those edges, not drawing new ones."

grounded_facts:
  - {id: G_KINASE_DISPENSABLE, statement: "Neither kinase activity nor the 265-residue kinase domain is required for checkpoint or stable attachments (731X restores both)", evidence: ["PMID:20516114"], consequence: "Any route premised on restoring BubR1 kinase activity is eliminated and does not appear in this map"}
  - {id: G_SEPARABLE, statement: "Alignment and checkpoint are separable functions (Y155C restores alignment and not checkpoint; 483X the converse)", evidence: ["PMID:20516114"], consequence: "Composite bypass must supply each function separately; one component is not assumed to cover both"}
  - {id: G_ALIGN_REGION, statement: "Stable kinetochore-microtubule attachment relies on the central region 484-715", evidence: ["PMID:20516114"]}
  - {id: G_ACT_REGION, statement: "The N-terminal TPR domain is required for checkpoint signalling via KNL1/Blinkin", evidence: ["PMID:20516114"]}
  - {id: G_MECHANISM, statement: "For the reference substrates, low abundance arises from HSP90-dependent misfolding and proteasomal clearance at normal transcript level", evidence: ["PMID:20516114"], consequence: "Grounds P1/P2 in the destabilising direction only"}
  - {id: G_SIRT2, statement: "SIRT2 activity and BubR1 abundance are coupled through K668 acetylation: raising SIRT2 raises abundance in mouse tissue, inhibiting Sirt2 destabilises BubR1 in human cells", evidence: ["PMID:24825348", "PMID:25672491"], consequence: "A grounded relation, untested on a misfolding substrate; it is the best-grounded candidate mechanism for STAB01 and grounds no rescue direction"}
  - {id: G_BUBR1_REQUIRED_FOR_CONGRESSION, statement: "BubR1 is required for the initiation of chromosome congression independently of its role in recruiting CENP-E, and its absence cannot be compensated by inhibiting Aurora kinases", evidence: ["PMID:41120314"], consequence: "Raises the bar for any alignment bypass: the function to be supplied is one BubR1 is directly required for, not merely one it assists"}
  - {id: G_NO_LIMITING_EXPERIMENT, statement: "Across all five full texts adjudicated, every experiment ran at BubR1-present or BubR1-absent (siRNA or degron depletion). None ran at BubR1-limiting", evidence: ["PMID:41120314", "PMID:38354735", "PMID:41218610", "PMID:39541344", "PMID:30341343"], consequence: "This case is BubR1-limiting, not BubR1-null. Every dependency verdict in the literature is therefore about a different regime, and that is why each dependency branch keeps an `unestablished` outcome rather than resolving on the published work"}
  - {id: G_LOCALISATION_NOT_FUNCTION, statement: "A BubR1-independent route can target a component to the kinetochore without being shown to deliver the component's function", evidence: ["PMID:38354735", "PMID:41120314"], consequence: "The same distinction Y155C forces inside this case: normal localisation with a dead function. A bypass candidate must be adjudicated on its function, never on its localisation"}
  - {id: G_THREE_FAMILIES, statement: "Three route families are distinguishable once independence stops being a success criterion: F1 repairs or stabilises the defective protein, F2 supplies a lost function without it, and F3 exploits the residual function that is present while altering a different physical process", derivation: "Structural consequence of this map, not a literature claim: it follows from defining the functional target by the terminal cellular state and from DEP_FLUX carrying independence as a classification rather than a success criterion", consequence: "F3 is only visible because the functional target is defined by the terminal cellular state rather than by the canonical trajectory. An approach that required repairing the gene first would not look for it"}
  - {id: G_KEN_SELF_DEFEATING, statement: "The BubR1 KEN degron is also required for checkpoint function", evidence: ["PMID:17406666", "PMID:20516114"], consequence: "Degron disruption is excluded as a stabilisation route on function grounds, not evidence grounds"}
