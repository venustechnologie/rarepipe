# MVA_001 contingent route map. Case data, not a new ontology: an AND/OR DAG whose
# transitions carry the grounding label vocabulary already used across docs/control.
# Validated and rendered by tools/control/compile_route_map.py.
map_version: "1.0"
case_ref: MVA_001

# The cell-level state is a biological state, never "normal BUB1B" — and it is not the disease.
# Reaching it in model says nothing about the child's clinical course, so reasoning continues past it
# to the next biological scale rather than stopping at a cell.
target:
  id: FUNCTIONAL_CELLULAR_TARGET
  conjunction: [T_MIS, T_VIA, T_DIV, T_DEATH]
  canonical_state: CANONICAL_CELLULAR_STATE
  canonical_conjunction: [T_ALIGN, T_ACT, T_SIL, T_MIS, T_VIA, T_DIV, T_DEATH]
  components:
    T_ALIGN:  correct chromosome alignment
    T_ACT:    correct checkpoint activation
    T_SIL:    correct checkpoint silencing
    T_MIS:    low chromosome missegregation
    T_VIA:    preserved viability
    T_DIV:    preserved division
    T_DEATH:  no increase in cell death
# T_ACT_RISK is no longer a cellular conjunct. It is a required gate on organism-level advancement;
# see target_audit.T_ACT_RISK and ORGANISM_TARGET.

# ---------------------------------------------------------------- target semantics audit
# The question: is each endpoint experimentally established as universally necessary for the desired
# terminal cellular state, or is it the mechanism by which normal cells usually achieve it? A
# synthetic route that safely produces faithful segregation must not be rejected for failing to
# reproduce the canonical BubR1 trajectory unless that trajectory is itself indispensable.
#
# Nothing is removed. The canonical state is still computed, and every endpoint keeps its node.
target_audit:
  T_MIS:
    verdict: TERMINAL_FUNCTIONAL_REQUIREMENT
    basis: "Aneuploidy is the disease-defining cellular phenotype. Nothing substitutes for it."
  T_VIA: &pop
    verdict: TERMINAL_FUNCTIONAL_REQUIREMENT
    basis: "A population that is dying, not dividing, or being selected is not a corrected population.
      These are also what stop permanent mitotic arrest counting as a solution."
  T_DIV: *pop
  T_DEATH: *pop
  T_ALIGN:
    verdict: CANONICAL_MECHANISTIC_INTERMEDIATE
    basis: "Alignment is how cells normally reach correct attachment; it is not the fidelity itself.
      Two retrieved findings separate them. Targeting poleward flux affects chromosome alignment
      'independently of kinetochore attachment status', so alignment and attachment are dissociable.
      And the chain from misalignment to aneuploidy is leaky: 'the majority of lagging chromosomes
      which arise due to chromosome alignment defects are able to integrate into the main nucleus',
      so an alignment defect does not deterministically produce an aneuploid daughter."
    evidence: ["PMID:39541344"]
    retained_as: "route-specific requirement for any route that works through attachment, and a
      mechanistic diagnostic everywhere else"
  T_ACT:
    verdict: CANONICAL_MECHANISTIC_INTERMEDIATE_CONDITIONALLY_NECESSARY
    basis: "The checkpoint is a response to error, not a producer of fidelity: it 'functions through
      unattached kinetochores, which generate a soluble mitotic checkpoint complex'. It buys time for
      correction, so its necessity is conditional on a baseline attachment-error rate — a route that
      prevented errors upstream would leave it nothing to signal. 483X shows the converse directly:
      checkpoint-competent and alignment-dead gives a significantly extended mitosis, not fidelity.
      It is not established as universally necessary for a euploid outcome."
    evidence: ["PMID:30341343", "PMID:20516114"]
    retained_as: "mechanistic diagnostic, and a safety question in its own right — see T_ACT_RISK"
  T_SIL:
    verdict: CANONICAL_MECHANISTIC_INTERMEDIATE_DOUBLY_CONDITIONAL
    basis: "Silencing is only required if the checkpoint is engaged — with no sustained signal there is
      nothing to silence. Its real cost is already carried by the population endpoints: failure to
      silence means prolonged arrest, which shows up as death, lost division or slippage."
    retained_as: "route-specific requirement for any route that restores checkpoint signalling"
  T_ACT_RISK:
    verdict: ORGANISM_ADVANCEMENT_RISK_GATE
    scale_correction: "Previously a conjunct of the cellular target, which was a scale error: tumour
      predisposition is not a property of a cell's mitotic phenotype and has no validated cellular
      surrogate, so requiring it to define the cell state made a cellular claim depend on
      organism-level knowledge. It is now a required gate before organism-level advancement. The gate
      is preserved in full — nothing may advance past the cell without it — so this is a scale
      correction, not a relaxation of safety."
    basis: "The strongest objection to reclassifying T_ACT, kept rather than argued away. Checkpoint
      deficiency is a tumour-predisposition mechanism independently of per-division missegregation,
      and this disorder already carries embryonal tumour risk. A route that reached euploidy without
      checkpoint competence could leave that liability untouched, and the missegregation endpoint
      would not see it. Whether checkpoint competence is required for this case on those grounds is
      itself unresolved, so it enters as a branch rather than as an assumption either way."
# ---------------------------------------------------------------- experimental campaigns
# Branch nodes are units of ignorance; campaigns are units of work. Several branches can be resolved
# by one set of observations, and counting branches alone overstates how many experiments a route
# needs. Nothing here invents time, cost or probability — a campaign is just a declared grouping of
# observations that can legitimately be collected together.
campaigns:
  - id: FLUX01
    question: "Does manipulation of poleward flux reduce chromosome missegregation in a BubR1-limiting
      human-cell state while preserving viability, cell death and division?"
    resolves: [DEP_FLUX, SAFE01]
    requires: CELL_MODEL
    component: "poleward flux, perturbed as in PMID:39541344 — low-dose taxol, or HAUS8 or NuMA codepletion"
    # Rule 4: the campaign verdict stays compact, but the arms are mechanistically independent and may
    # disagree. Arm-level states are retained where they would differ; worlds producing the same
    # biological state are merged rather than duplicated.
    arms:
      F_a: {actuator: low_dose_paclitaxel, control_variable: CV_POLEWARD_FLUX, engagement_readout: "k-fibre flux rate"}
      F_b: {actuator: HAUS8_depletion, control_variable: CV_POLEWARD_FLUX, engagement_readout: "overlap length and flux rate"}
      F_c: {actuator: NuMA_depletion, control_variable: CV_POLEWARD_FLUX, engagement_readout: "overlap length and flux rate"}
    arm_level_rule: "An arm that fails on efficacy, safety or engagement closes that ACTUATOR. It closes
      CV_POLEWARD_FLUX only when every arm fails on efficacy with engagement validated — one unsafe
      actuator is not an unsafe control variable, which is Rule 3 applied inside a campaign. Arms that
      lower missegregation with the population preserved all converge on the same state and are merged
      there; the arm identity is retained in the record because it is what a later actuator choice
      depends on."
    arm_divergence_outcomes:
      some_arms_effective_some_unsafe: "the control variable survives on the effective, safe arms; the
        unsafe arms are closed individually and named"
      all_arms_unsafe_engagement_validated: "escalates to a question about CV_POLEWARD_FLUX itself, and
        only then may the variable be called intrinsically unsafe"
      all_arms_ineffective_engagement_validated: "closes CV_POLEWARD_FLUX for this state, which is the
        no_reduction verdict"
    primary_endpoints: [missegregation, viability, cell_death, division_rate]
    diagnostics: [chromosome_alignment, checkpoint_activation, checkpoint_silencing]
    diagnostics_note: "Alignment, activation and silencing are recorded as mechanistic diagnostics, not
      success criteria. A route that lowers missegregation with the population preserved is not failed
      for leaving the canonical trajectory unreproduced — that is the target audit's whole point."
    bubr1_state_required: "limiting, not absent — the regime no published experiment has used, and the
      reason DEP_FLUX cannot be resolved from the literature"
    # Item 6: every admissible joint result, decided in advance. A campaign resolves two branches at
    # once, so its outcomes are joint ones, and each is mapped to the branch outcomes it implies.
    outcomes:
      lower_missegregation_population_preserved:
        {DEP_FLUX: independent_of_bubr1, SAFE01: preserved}
      lower_missegregation_population_harmed:
        {DEP_FLUX: independent_of_bubr1, SAFE01: harm}
      no_reduction:
        {DEP_FLUX: no_reduction}
      lower_missegregation_benefit_needs_residual_bubr1:
        {DEP_FLUX: benefit_requires_residual_bubr1, SAFE01: preserved}
      benefit_absent_in_limiting_regime:
        {DEP_FLUX: benefit_absent_in_limiting_regime}
      insufficient_or_invalid:
        {DEP_FLUX: unestablished, SAFE01: insufficient}
  - id: CHAR01
    question: "Does this exact allele destabilise the protein at all?"
    resolves: [CHAR01]
    requires: CELL_MODEL
    note: "First experiment on the abundance family. Upstream of every other F1 branch and needs no
      patient material."
  - id: STAB01
    question: "Can a misfolding kinase-domain BubR1 missense protein be stabilised in a human cell, and
      does the manipulation preserve the population?"
    resolves: [STAB01, SAFE02]
    requires: CELL_MODEL
    note: "The stabilisation protocol already collects cell-state readouts (viability, death, division)
      in the same experiments, so the manipulation's own safety is not a separate campaign."
  - id: TRIP13_01
    question: "Does augmenting TRIP13/APC15-driven MCC turnover restore timely exit in a BubR1-limiting
      state without degrading activation, and does the population survive it?"
    resolves: [DEP_TRIP13, SAFE01]
    requires: CELL_MODEL
    component: "TRIP13 with APC15"
    note: "Resolves SAFE01 only for this component. Population safety is manipulation-specific, so a
      different bypass component needs its own observation."
campaign_note: "SAFE01 appears in two campaigns because it is component-specific: whichever campaign
  introduces a component establishes safety for that component and no other."
requires_vocabulary: [CELL_MODEL, TISSUE_MODEL, ORGANISM_MODEL, GOVERNANCE_ABSENT]
label_vocabulary: [GROUNDED, CONTEXT_TRANSFER_REQUIRED, EXPERIMENTAL_UNKNOWN,
                   PHYSICAL_ACTUATOR_MISSING, CONCEPTUALLY_SUFFICIENT_ONLY, UNSAFE]
resolves_by_vocabulary: [MEASUREMENT, COMPONENT_DISCOVERY]
ultimate_target:
  id: ORGANISM_TARGET
  note: "Modification of this child's clinical course. Not reachable by any route in this map today, and
    bounded by governance as well as biology: no intervention in this child is authorised, there is no
    recontact, and much of the phenotype is developmental and already established."
# Rule 7. A branch may stop only at one of these, and NO_KNOWN_CONTINUATION is gone: every one of the
# thirteen nodes that carried it turned out to be a branch nobody had expanded, not a real end.
terminal_vocabulary: [FUNCTIONAL_TARGET_REACHED, ORGANISM_TARGET_REACHED_IN_MODEL, UNSAFE,
                      GOVERNANCE_BLOCKED, PHYSICALLY_INCOMPATIBLE_WITH_EVIDENCE,
                      SEARCHED_EXTERNAL_UNIVERSE_EXHAUSTED, DECLARED_SCIENTIFIC_FRONTIER,
                      UNEXPANDED_FRONTIER, NOT_IN_LOCAL_CASE_CORPUS, CONTEXT_TRANSFER_REQUIRED,
                      BOUNDED_FRONTIER]
# Rule 3. A control variable is a biological quantity; an actuator is a way of moving it. A failed or
# unsafe actuator closes the actuator, never the variable, unless the evidence speaks to the variable
# itself. Every "no actuator" terminal in the previous map violated this.
control_variables:
  CV_BUBR1_ABUNDANCE:
    state_variable: "steady-state abundance of the altered BubR1 protein"
    actuators_tried: [HSP90_folding, proteasomal_clearance, SIRT2_K668, FBXW7_T620]
    actuators_identified_not_tried: [CHIP_STUB1_triage, autophagy_lysosomal, HSP70_DNAJ_cochaperone]
    evidence: ["PMID:42567515", "PMID:41525846", "PMID:41265458", "PMID:34544131"]
    intrinsically_unsafe: NOT_ESTABLISHED
  CV_POLEWARD_FLUX:
    state_variable: "k-fibre poleward flux rate, set by antiparallel overlap length"
    actuators_tried: []
    actuators_identified_not_tried: [low_dose_taxol, HAUS8_depletion, NuMA_depletion, KIF4A_depletion]
    evidence: ["PMID:39541344"]
    intrinsically_unsafe: NOT_ESTABLISHED
  CV_CHROMOSOME_ALIGNMENT:
    state_variable: "fraction of chromosomes congressed and bioriented at the plate"
    actuators_identified_not_tried: [CENP_E, KIF18A, poleward_flux]
    note: "CENP-E and KIF18A are BubR1-dependent for this function, which makes them F3 candidates
      rather than dead ones — the variable is not closed by an actuator's dependency."
  CV_CHECKPOINT_ACTIVATION:
    state_variable: "arrest competence on unattached kinetochores"
    actuators_identified_not_tried: [MPS1_phosphorylation_cascade]
    evidence: ["PMID:28072388"]
    intrinsically_unsafe: "PARTLY — chronic activation causes myelosuppression and gastrointestinal
      atrophy in vivo, so the sustained form of this variable carries organism-level harm. A transient
      or conditional form is not covered by that evidence and stays open."
    unsafe_evidence: ["PMID:38806674"]
  CV_CHECKPOINT_SILENCING:
    state_variable: "time from alignment to anaphase onset"
    actuators_identified_not_tried: [TRIP13_APC15, UBR5]
    evidence: ["PMID:30341343", "PMID:35217622"]
  CV_ANEUPLOID_CELL_FRACTION:
    state_variable: "fraction of aneuploid cells in a population or tissue"
    actuators_identified_not_tried: [cell_competition, lineage_specific_elimination]
    evidence: ["PMID:33847264", "PMID:42409819", "PMID:40466636"]
    note: "The F4 family. It does not prevent errors; it removes the cells that carry them, which is
      the only route that can touch aneuploidy already established."
    intrinsically_unsafe: "NOT_ESTABLISHED, and in tension with this project's own guards: a falling
      aneuploid fraction through selective loss is exactly the confounder B08 and B18 exist to catch.
      Here it would be the mechanism rather than the artefact, which does not make it safe."
# Rule 2 and the F4 addition. Families are maintained explicitly so each is expanded through happy and
# unhappy outcomes rather than only where it is currently shortest.
families:
  F1_REPAIR: "restore or stabilise the altered protein"
  F2_REPLACE: "supply the required function independently of it"
  F3_EXPLOIT_AND_ALTER: "exploit the residual function that is present while altering another physical process"
  F4_REMOVE: "do not prevent the error; remove the cells that carry it"
# A bounded negative search is not biological impossibility. NO_KNOWN_PHYSICAL_REALIZATION is reserved
# for evidence that justifies it; a search that simply came back empty gets the middle state.

nodes:
  # ---------- forward from the current case state ----------
  - {id: S0_CASE, kind: state, label: "Current case state: compound heterozygous BUB1B, truncating allele plus kinase-domain missense allele; mosaic variegated aneuploidy"}
  - {id: S_CLASS_PREMISE, kind: state, label: "Class-level premise: kinase-domain missense reduces BubR1 abundance via misfolding and elevated turnover. MC_0005 PARTIALLY_SUPPORTED on 0 establishing / 11 indirect records"}
  - {id: S_ABUNDANCE_LOW, kind: state, label: "This allele's protein is present at reduced steady-state abundance"}
  - {id: S_ABUNDANCE_NORMAL, kind: state, label: "This allele's protein is present at normal abundance, so any defect is not an abundance defect"}
  - {id: S_MISSEGREGATION, kind: state, label: "Chromosome missegregation and aneuploidy (the disease state)"}
  # ---------- the abundance family (F1): restore the child's own protein ----------
  - {id: S_MATCHED_ACHIEVABLE, kind: state, label: "The exact allele can be held at wild-type-comparable abundance in a human cell"}
  - {id: S_FUNCTION_OK, kind: state, label: "At matched abundance the exact altered protein supports alignment, silencing and segregation"}
  - {id: S_REF_STABILISABLE, kind: state, label: "A perturbation raises the steady-state abundance of the reference destabilised substrates (I909T / L1012P)"}
  - {id: S_CASE_STABILISABLE, kind: state, label: "The same perturbation raises the exact case allele's steady-state abundance"}
  - {id: S_STABILISED_FUNCTIONAL, kind: state, label: "The protein stabilised by that perturbation is functional, not merely present"}
  - {id: F1_COMPLETE, kind: all_of, of: [S_XFER_OK, S_POP_SAFE_F1B], label: "Abundance route complete: the child's own protein, raised by a physical perturbation, functional, in a relevant cell, without population harm"}
  - {id: S_XFER_OK, kind: state, label: "The effect transfers to a cell type relevant to this child"}
  # ---------- the bypass family (F2): supply the function independently ----------
  - {id: S_ALIGN_SUPPLIED, kind: state, label: "Chromosome alignment supplied independently of the child's BubR1"}
  - {id: S_SIL_SUPPLIED, kind: state, label: "Checkpoint silencing supplied independently of the child's BubR1"}
  - {id: S_ACT_SUPPLIED, kind: state, label: "Checkpoint activation supplied independently of the child's BubR1"}
  - {id: F2_COMPLETE, kind: all_of, of: [S_ALIGN_SUPPLIED, S_ACT_SUPPLIED, S_SIL_SUPPLIED, S_POP_SAFE_F2], label: "Composite bypass complete: every lost function supplied without the child's BubR1, without population harm"}
  # Population safety is manipulation-specific and must not be shared between families: EXP01's
  # viability, death and division readouts are observations about ectopic expression of the altered
  # protein, and say nothing about whatever component a bypass would introduce.
  - {id: S_POP_SAFE_F1, kind: state, label: "No increase in cell death, no loss of viability or division rate, under EXP01's ectopic-expression condition"}
  - {id: S_POP_SAFE_F1B, kind: state, label: "No increase in cell death, no loss of viability or division rate, under the actual physical stabilisation manipulation"}
  - {id: S_COMPOSITE_VALIDATED, kind: state, label: "The assembled composite system was directly shown to lower chromosome missegregation while holding the required functional state and population safety"}
  - {id: S_POP_SAFE_F2, kind: state, label: "No increase in cell death, no loss of viability or division rate, under the bypass component"}

  # ---------- branch nodes: unresolved, enumerated, never terminal ----------
  - id: CHAR01
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does this exact allele destabilise the protein at all? Cycloheximide chase, HSP90 inhibition and MG132 on an exact-allele construct beside wild-type and the reference substrates. No patient material required."
    why_unresolved: "MC_0006 ('this child's missense allele reduces BUBR1 abundance or function') is UNRESOLVED on zero establishing records. Q921H is a kinase-domain substitution that is normal in both level and function, so domain location does not establish instability."
    outcomes:
      destabilised_like_reference: S_ABUNDANCE_LOW
      not_destabilised:            S_ABUNDANCE_NORMAL
      destabilised_other_mechanism: S_ABUNDANCE_LOW_OTHER
      not_expressible:             S_NOT_EXPRESSIBLE
  - {id: S_NOT_EXPRESSIBLE, kind: state, label: "The exact allele did not reach wild-type-comparable abundance in the tested construct and condition — a property of this construct and promoter, not yet a property of the protein"}
  - {id: S_ABUNDANCE_LOW_OTHER, kind: state, label: "Reduced abundance by a route that is not HSP90-dependent misfolding, so P1/P2 grounding does not apply"}

  - id: EXP01
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "At matched abundance, are alignment, silencing and segregation normal for the exact altered protein?"
    why_unresolved: "No experiment has expressed this exact substitution at wild-type-comparable abundance. Checkpoint activation is class-supported and is a replication control, not a discriminator."
    outcomes:
      full_function:        S_FUNCTION_OK
      alignment_defect:     B_ALIGN_DEFECT
      silencing_defect:     B_SIL_DEFECT
      segregation_defect:   B_SEG_DEFECT
      multiple_defects:     B_MULTI_DEFECT
      matched_not_achieved: T_EXP01_CEILING
      confounded_invalid:   T_EXP01_REPEAT
  - {id: B_ALIGN_DEFECT, kind: state, label: "Alignment remains defective at matched abundance: the central region function is not supplied by this protein"}
  - {id: B_SIL_DEFECT, kind: state, label: "Silencing remains defective at matched abundance"}
  - {id: B_SEG_DEFECT, kind: state, label: "Segregation remains defective at matched abundance"}
  - {id: B_MULTI_DEFECT, kind: state, label: "More than one function remains defective at matched abundance"}

  - id: STAB01
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Can the steady-state abundance of a misfolding kinase-domain BubR1 missense protein be raised in a human cell by perturbing folding or degradation machinery?"
    why_unresolved: "Search closed at 50 queries over four rounds: no record raises abundance or slows turnover of a destabilised BubR1 missense protein. P1/P2 are grounded only in the destabilising direction."
    outcomes:
      steady_state_increased: S_REF_STABILISABLE
      turnover_reduced_only:  B_TURNOVER_ONLY
      local_pool_only:        S_POOL_ONLY
      no_stabilisation:       S_P1P4_EXHAUSTED
      insufficient:           T_STAB01_REPEAT
  - {id: B_TURNOVER_ONLY, kind: state, label: "Turnover measurably slowed without a steady-state rise: another process, most likely synthesis or folding capacity, is rate-limiting"}

  - id: STAB02
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does the working perturbation raise the exact case allele's abundance toward wild-type?"
    why_unresolved: "Reached only under the STAB01 stop rule; the exact allele has never been placed in such a system."
    outcomes:
      case_allele_stabilised: S_CASE_STABILISABLE
      case_allele_refractory: S_CASE_REFRACTORY
      insufficient:           T_STAB02_REPEAT

  - id: FUNCVAL01
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Is the protein stabilised by that perturbation functional, or merely present?"
    why_unresolved: "A chaperone-retained protein can be abundant and non-native. EXP01 answers function at ectopically matched abundance, which is a different condition from function under a stabilising perturbation."
    outcomes:
      functional:     S_STABILISED_FUNCTIONAL
      not_functional: S_PRESENT_NON_NATIVE
      insufficient:   T_FUNCVAL_REPEAT

  - id: XFER01
    kind: branch
    resolves_by: MEASUREMENT
    requires: GOVERNANCE_ABSENT
    label: "Does the effect hold in a cell type relevant to this child?"
    why_unresolved: "Every result in this map comes from cancer lines. No patient-derived material is available and none may be acquired."
    outcomes:
      transfers:        S_XFER_OK
      does_not_transfer: T_NO_TRANSFER
      cannot_be_tested: T_XFER_BLOCKED

  - id: SAFE01
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does the bypass component preserve viability, division rate and cell death?"
    why_unresolved: "A component that supplies a mitotic function has no safety record until it is named; nothing can be inherited from the abundance route, whose safety readouts are observations about a different manipulation."
    outcomes:
      preserved:    S_POP_SAFE_F2
      harm:         T_UNSAFE
      insufficient: T_SAFE01_REPEAT

  - id: SAFE02
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does the physical stabilisation manipulation itself preserve viability, division rate and cell death?"
    why_unresolved: "Chaperone and degradation perturbations are broadly cytotoxic at the doses that engage their targets, and EXP01's readouts describe a different manipulation entirely."
    outcomes:
      preserved:    S_POP_SAFE_F1B
      harm:         T_UNSAFE_F1
      insufficient: T_SAFE02_REPEAT

  - id: EXPRVAL01
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Is the failure to reach wild-type-comparable abundance a property of the construct and condition rather than the protein?"
    why_unresolved: "Codon usage, promoter strength, tag placement and degradation during expression are all testable, and mitotic checkpoint gene expression is known to be tuned by codon usage."
    outcomes:
      construct_limited:       S_ABUNDANCE_LOW
      protein_limited:         S_PROTEIN_CEILING
      insufficient:            T_EXPR_INVALID

  - id: COMPOSITE_VALID
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does the assembled composite system actually lower chromosome missegregation while holding the functional state and population safety?"
    why_unresolved: "No composite has been assembled, and the component functions interact: a protein recruited to supply one function may perturb another."
    outcomes:
      system_validated:   S_COMPOSITE_VALIDATED
      functions_conflict: S_COMPOSITE_CONFLICTED
      no_improvement:     S_COMPOSITE_INEFFECTIVE
      insufficient:       T_COMPOSITE_REPEAT

  # ---------- named alignment candidates, from data/literature/mva-bypass-v1 ----------
  - {id: C_CENPE, kind: state, label: "CENP-E/kinesin-7: demonstrated to initiate chromosome congression of polar chromosomes, and physically manipulable (depletion, inhibition, truncation constructs)"}
  - {id: C_KIF18A, kind: state, label: "KIF18A: promotes chromosome congression in cooperation with CENP-E downstream of CENP-C, identified in a genome-wide Cas9 screen; physically manipulable (knockout, inhibitors)"}
  - {id: C_FLUX, kind: state, label: "Microtubule poleward flux: reported as a target for modifying chromosome segregation errors — a physical handle on the microtubule side rather than on kinetochore signalling"}

  - id: DEP_KIF18A
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does KIF18A support chromosome alignment when BubR1 is limiting, or does its congression role run through CENP-E and therefore through BubR1?"
    why_unresolved: "Full-text adjudication: KIF18A's own paper mentions BubR1 only as a localisation marker, so no experiment places it in a BubR1-limited background. PMID:41120314 additionally shows congression after CENP-E reactivation succeeds without KIF18A activity, so KIF18A is not an alternative driver of the congression-initiation step BubR1 is required for; its remaining relevance is alignment at the metaphase plate. Absence of a direct BubR1 link is not independence."
    outcomes:
      independent_of_bubr1: S_ALIGN_SUPPLIED
      requires_bubr1:       S_KIF18A_BUBR1_DEPENDENT
      unestablished:        T_KIF18A_FRONTIER

  - id: DEP_FLUX
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does modifying poleward flux lower missegregation in a BubR1-limiting background, and is the benefit independent of residual BubR1 or does it exploit it?"
    classification_not_success: "Independence is a mechanistic classification, not a success criterion. The functional target requires low missegregation with the population preserved; it does not require that the route avoid BubR1. A benefit that depends on residual BubR1 is a compensatory route rather than a failed bypass, and it only closes if the benefit disappears in the limiting regime this case actually occupies."
    why_unresolved: "Full-text adjudication: BubR1 appears zero times in 454 sentences, so dependency is wholly unaddressed and silence is not independence. What the full text does add is a positive mechanistic argument — by targeting poleward flux, chromosome alignment is affected independently of kinetochore attachment status, which is the axis BubR1 acts on — plus three mechanistically independent perturbations (low-dose taxol, HAUS8 or NuMA codepletion) that rescued misalignment, lagging chromosomes and micronuclei in human RPE-1 and in OVKATE cells, and a stated predictor of when it works (antiparallel overlap length). The misalignment rescued was flux-driven, not attachment-driven, which is the transfer this case needs."
    outcomes:
      independent_of_bubr1:              S_FLUX_LOWERS_MIS
      benefit_requires_residual_bubr1:   S_FLUX_COMPENSATORY
      benefit_absent_in_limiting_regime: S_FLUX_NEEDS_MORE_BUBR1
      no_reduction:                      S_FLUX_NOT_THE_LEVER
      unestablished:                     T_FLUX_FRONTIER

  # ---------- named silencing candidate ----------
  - {id: C_TRIP13, kind: state, label: "TRIP13 with APC15: catalytic MCC disassembly drives timely mitotic exit; degron-tagged depletion shows the requirement, so the state is physically manipulable"}

  - id: DEP_TRIP13
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does augmenting TRIP13/APC15-driven MCC turnover restore timely exit without requiring BubR1, and without degrading checkpoint activation?"
    why_unresolved: "Full-text adjudication confirms the trade-off in one system and sharpens it. The two disassembly pathways do not target BubR1 directly (Mad2 for TRIP13/p31comet, Cdc20 for APC15), so dependency is indirect — but the substrate complex contains BubR1, the arrest TRIP13 depletion causes was itself dependent on Mad2 and BubR1 (Fig. 3b), and every experiment ran at BubR1-present. The dual role is demonstrated, not inferred: losing TRIP13 in interphase causes checkpoint activation failure through loss of soluble O-Mad2 (half-time 1.4 h), while losing it just before mitosis causes a dramatic delay in exit. The authors frame TRIP13 as a counter-balance in a delicate equilibrium and note that both loss and overexpression matter, so augmenting it for silencing cannot be assumed to leave activation intact."
    outcomes:
      independent_and_specific: S_SIL_SUPPLIED
      requires_bubr1:           S_TRIP13_BUBR1_DEPENDENT
      degrades_activation:      S_TRIP13_CONFLICTED
      unestablished:            T_TRIP13_FRONTIER

  - id: BYPASS_ACT
    kind: branch
    resolves_by: COMPONENT_DISCOVERY
    requires: CELL_MODEL
    label: "Is there a physically realisable way to supply checkpoint activation independently?"
    why_unresolved: "The TPR-KNL1 route is grounded as a requirement, not as a suppliable component."
    outcomes:
      grounded_component_found: S_ACT_SUPPLIED
      no_component:             S_ACT_NO_COMPONENT_YET

  # ---------- terminals ----------
  # Two definitions, both computed. The canonical state is the full BubR1 trajectory; the functional
  # target is the terminal state we actually want, open to any physically valid route.
  - {id: CANONICAL_CELLULAR_STATE, kind: state, label: "Canonical cell state: alignment, activation, silencing, low missegregation, viability, division and no added death — the trajectory a normal cell takes"}
  - {id: S_MIS_LOWERED, kind: state, label: "Chromosome missegregation is low, by whatever route produced it"}
  - {id: S_POP_SAFE_ANY, kind: state, label: "The manipulation that got here has its own population safety established"}
  - {id: S_CHECKPOINT_RISK_RESOLVED, kind: state, label: "The tumour-predisposition consequence of checkpoint competence is resolved for this case"}
  - {id: FUNCTIONAL_CELLULAR_TARGET, kind: all_of, of: [S_MIS_LOWERED, S_POP_SAFE_ANY], label: "Functional cell-level target: low missegregation with the population preserved and the checkpoint-risk question resolved, by any physically valid route"}
  - {id: S_FLUX_LOWERS_MIS, kind: state, label: "Modifying poleward flux lowers missegregation in a BubR1-limited background"}

  - id: ACT_SAFETY01
    kind: branch
    resolves_by: MEASUREMENT
    requires: ORGANISM_MODEL
    label: "Is checkpoint competence required for this case on tumour-predisposition grounds, independently of per-division missegregation?"
    why_unresolved: "Checkpoint deficiency predisposes to tumours by a route the missegregation endpoint does not measure, and this disorder already carries embryonal tumour risk. Nothing establishes whether a euploid-but-checkpoint-deficient state carries that liability, so it is asked rather than assumed either way."
    executability_adjudication:
      question_1: "Do existing experiments establish that tumour risk is causally independent of chromosome fidelity?"
      answer_1: "NO. The human syndromes couple the two rather than separating them — biallelic MAD1L1 mutation gives aneuploidy with high tumour susceptibility, and biallelic MAD2L1BP (p31comet) mutation gives mosaic aneuploidy with juvenile granulosa cell tumour — and aneuploidy is the proposed mechanism in both. In mice, checkpoint and p53 deficiencies cooperate for tumorigenesis, so the path to tumours is context-dependent rather than a direct checkpoint-to-tumour link. Nobody has shown a checkpoint-deficient but euploid state that is tumour-prone."
      evidence_1: ["PMID:36322655", "PMID:37796616", "PMID:19065665", "PMID:19546858"]
      question_2: "Is there a validated cell-level surrogate that could answer it?"
      answer_2: "NO. Tumour susceptibility in this literature is an organism-level, long-timescale outcome measured in mouse cohorts or human syndromes. Transformation assays exist but none is validated as a predictor of predisposition for this question."
      consequence: "Reclassified from CELL_MODEL to ORGANISM_MODEL and retained as an unresolved risk gate. A negative cell assay must not be promoted to 'checkpoint competence is not required for tumour risk'."
      what_would_make_it_answerable: "If the tumour risk in these syndromes is mediated by aneuploidy, then a route that lowers missegregation addresses the mechanism and checkpoint competence per se is not required. If the risk has a checkpoint-independent arm, it is. That is the causal-independence question, and it is now sharply framed rather than resolved."
    outcomes:
      not_required_for_this_state: S_CHECKPOINT_RISK_RESOLVED
      checkpoint_competence_required: S_ACT_COMPETENCE_REQUIRED
      unestablished: T_ACT_RISK_FRONTIER
  # A result that makes checkpoint competence necessary creates a new requirement; it does not end
  # the reasoning. Two families can supply it, and both stay open.
  - {id: S_ACT_COMPETENCE_REQUIRED, kind: state, label: "Checkpoint competence is required on predisposition grounds: the functional target gains a conjunct and the activation question becomes a real gate, to be supplied by either family"}
  - {id: T_ACT_RISK_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Whether checkpoint competence is needed on predisposition grounds is unestablished; the question is specified and unasked"}
  # ---------- beyond the cell: the scales this map previously stopped short of ----------
  - {id: S_TISSUE_FRACTION_FALLS, kind: state, label: "The aneuploid cell fraction falls in a tissue relevant to this child's phenotype"}
  - {id: S_CLINICAL_MODIFIED, kind: state, label: "A measurable feature of the clinical course is modified"}
  # That a prospective component exists is a precondition for modifying the course, not the
  # modification itself. Keeping them separate is what stops the map claiming a clinical effect from
  # the mere possibility of one.
  - {id: S_PROSPECTIVE_EXISTS, kind: state, label: "Part of the phenotype is still ahead of the child and therefore addressable in principle"}
  - {id: S_ORG_SAFE, kind: state, label: "No organism-level harm from the manipulation"}
  - {id: ORGANISM_TARGET, kind: all_of, of: [S_CLINICAL_MODIFIED, S_ORG_SAFE, S_PROSPECTIVE_EXISTS, S_CHECKPOINT_RISK_RESOLVED], label: "Organism-level target: clinical course modified without organism-level harm"}
  - {id: T_ORGANISM_REACHED, kind: terminal, terminal: ORGANISM_TARGET_REACHED_IN_MODEL, label: "Organism-level target reached in model"}
  - {id: S_AGGREGATION_FAILS, kind: state, label: "Per-division fidelity improved and the tissue aneuploid fraction did not fall"}
  - {id: T_TISSUE_UNTESTABLE, kind: terminal, terminal: GOVERNANCE_BLOCKED, label: "No tissue-level readout is available for this child: a governance boundary, since no sampling is authorised and there is no recontact"}
  - {id: S_ESTABLISHED_BURDEN, kind: state, label: "The developmental component already laid down is not addressable by improving future divisions"}
  - {id: S_CLINICAL_LINK_UNRESOLVED, kind: state, label: "Tissue aneuploidy fell without a measurable change in the clinical feature that was chosen"}
  - {id: T_CLINICAL_UNTESTABLE, kind: terminal, terminal: GOVERNANCE_BLOCKED, label: "Not assessable: no intervention in this child is authorised, so clinical-course modification cannot be observed here"}

  - id: XSCALE01
    kind: branch
    resolves_by: MEASUREMENT
    requires: TISSUE_MODEL
    label: "Does improving per-division fidelity lower the aneuploid cell fraction in a relevant tissue?"
    why_unresolved: "Every readout in this map is per-division in cultured cells. A tissue's aneuploid fraction is a population property set by division fidelity, selection and clearance together, and nothing here measures the aggregate."
    outcomes:
      fraction_falls: S_TISSUE_FRACTION_FALLS
      no_aggregate:   S_AGGREGATION_FAILS
      untestable:     T_TISSUE_UNTESTABLE

  - id: IRREV01
    kind: branch
    resolves_by: MEASUREMENT
    requires: ORGANISM_MODEL
    label: "Is the already-established component of the phenotype reversible by improving mitotic fidelity from now on?"
    why_unresolved: "Mosaic variegated aneuploidy is constitutional: much of the burden is developmental and already laid down. Improving fidelity prospectively does not undo an aneuploid cell that already exists, and nothing establishes which part of the phenotype is prospective."
    outcomes:
      prospective_component_exists: S_PROSPECTIVE_EXISTS
      established_and_fixed:        S_ESTABLISHED_BURDEN
      unestablished:                T_IRREV_FRONTIER
  - {id: T_IRREV_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Which part of the phenotype is prospective is unestablished; the question is specified and unasked"}

  - id: XSCALE02
    kind: branch
    resolves_by: MEASUREMENT
    requires: ORGANISM_MODEL
    label: "Does a lower tissue aneuploid fraction modify a measurable feature of the clinical course?"
    why_unresolved: "The link from aneuploid burden to clinical feature is not quantified for this disorder, and the phenotype is multi-system."
    outcomes:
      course_modified: S_CLINICAL_MODIFIED
      no_change:       S_CLINICAL_LINK_UNRESOLVED
      unassessable:    T_CLINICAL_UNTESTABLE

  - id: SAFE_ORG
    kind: branch
    resolves_by: MEASUREMENT
    requires: ORGANISM_MODEL
    label: "Does the manipulation avoid organism-level harm?"
    why_unresolved: "No candidate in this map has an organism-level safety record, and several act on machinery (chaperones, the proteasome, mitotic motors) with broad effects outside mitosis."
    outcomes:
      no_harm:      S_ORG_SAFE
      harm:         T_UNSAFE_ORG
      unassessable: T_ORG_SAFETY_FRONTIER
  - {id: T_UNSAFE_ORG, kind: terminal, terminal: UNSAFE, label: "Organism-level harm: closed on safety grounds"}
  - {id: T_ORG_SAFETY_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Organism-level safety unassessable for an unnamed component"}
  - {id: T_EXPR_INVALID, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Expression validity unresolved: the construct and condition are the suspect, not the protein"}
  - {id: T_EXP01_CEILING, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Matched abundance not achieved: function at matched abundance stays unresolved and the route re-enters at STAB01"}
  - {id: T_EXP01_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Confounded or invalid: the failed validity gate is named and the condition repeated"}
  - {id: T_STAB01_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Perturbation did not engage, or the population was compromised: repeat under a valid condition"}
  - {id: T_STAB02_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_FUNCVAL_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: S_POOL_ONLY, kind: state, label: "The abundance change is confined to the kinetochore pool"}
  - {id: S_P1P4_EXHAUSTED, kind: state, label: "Not controllable through the four interrogated mechanisms (HSP90, proteasomal, SIRT2, FBXW7). Four actuators, not the control variable"}
  - {id: S_CASE_REFRACTORY, kind: state, label: "The reference class stabilises and this allele does not under the tested actuator"}
  - {id: S_PRESENT_NON_NATIVE, kind: state, label: "Abundance was raised and function was not restored: the protein is present without being native"}
  - {id: T_NO_TRANSFER, kind: terminal, terminal: CONTEXT_TRANSFER_REQUIRED, label: "Effect does not hold in a relevant cell type"}
  - {id: T_XFER_BLOCKED, kind: terminal, terminal: GOVERNANCE_BLOCKED, label: "Cannot be tested: no patient-derived material is available and acquisition is not authorised. A governance boundary, not a biological one"}
  - {id: S_PROTEIN_CEILING, kind: state, label: "The protein itself cannot be held at wild-type-comparable abundance by expression alone — a real ceiling, established rather than assumed"}
  - {id: T_UNSAFE_F1, kind: terminal, terminal: UNSAFE, label: "The stabilisation manipulation harms the population: closed on safety grounds whatever it does to abundance"}
  - {id: T_SAFE02_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Safety readouts invalid under the stabilisation manipulation: repeat"}
  - {id: S_COMPOSITE_CONFLICTED, kind: state, label: "Components supply their functions individually and conflict as an assembled system in the tested configuration"}
  - {id: S_COMPOSITE_INEFFECTIVE, kind: state, label: "The assembled system did not lower missegregation, so the functions supplied were not the limiting ones"}
  - {id: T_COMPOSITE_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Composite validation invalid: repeat"}
  - {id: T_UNSAFE, kind: terminal, terminal: UNSAFE, label: "The component supplies the function and harms the population: closed on safety grounds, and no benefit verdict overrides it"}
  - {id: T_SAFE01_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Safety readouts invalid: repeat under a valid condition"}
  - {id: S_CENPE_BUBR1_DEPENDENT, kind: state, label: "CENP-E's congression function requires BubR1, so it cannot replace it — which makes it a candidate for exploiting it instead"}
  - {id: S_KIF18A_BUBR1_DEPENDENT, kind: state, label: "KIF18A's alignment role requires BubR1"}
  - {id: T_KIF18A_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "KIF18A dependency unestablished: the experiment is specified and unrun"}
  # Engaged and ineffective is a different result from dependent or untested, and it continues:
  # flux is not the lever in this state, which leaves the other alignment candidate and F1.
  # The third strategy, between repairing the protein and routing around it: exploit the residual
  # function that is there and change a different physical process. The functional target never
  # required BubR1-independence, so this reaches it exactly as a bypass would.
  - {id: S_FLUX_COMPENSATORY, kind: state, label: "Flux manipulation lowers missegregation with the population preserved, and the benefit depends on residual BubR1: a compensatory route — residual function exploited, a different physical process altered"}
  - {id: S_FLUX_NOT_THE_LEVER, kind: state, label: "The flux manipulation engaged its target and missegregation did not fall: flux is not the controllable physics for this state"}
  - {id: S_FLUX_NEEDS_MORE_BUBR1, kind: state, label: "The flux benefit is present in replete cells and absent at the limiting end: it needs more BubR1 than this case has"}
  - {id: T_FLUX_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Flux dependency unestablished: the experiment is specified and unrun"}
  - {id: S_TRIP13_BUBR1_DEPENDENT, kind: state, label: "TRIP13-driven exit requires BubR1"}
  - {id: S_TRIP13_CONFLICTED, kind: state, label: "Augmenting TRIP13 restored exit at the cost of checkpoint activation"}
  - {id: T_TRIP13_FRONTIER, kind: terminal, terminal: BOUNDED_FRONTIER, label: "TRIP13 dependency and specificity unestablished: the experiment is specified and unrun"}
  - {id: T_ALIGN_NO_ACTUATOR, kind: terminal, terminal: SEARCHED_EXTERNAL_UNIVERSE_EXHAUSTED, label: "Every named alignment candidate failed dependency adjudication and no further candidate survived two search depths. Reached only when all of them are closed"}
  - {id: T_SIL_NO_ACTUATOR, kind: terminal, terminal: SEARCHED_EXTERNAL_UNIVERSE_EXHAUSTED, label: "Every named silencing candidate failed dependency adjudication and no further candidate survived two search depths. Reached only when all of them are closed"}
  - {id: S_ACT_NO_COMPONENT_YET, kind: state, label: "No component survived function-first discovery for checkpoint activation at the first depth; a named mechanistic handle exists at the second"}

  # ================= continuations opened by the Rule 5 audit =================
  # Each of these existed as a NO_KNOWN_CONTINUATION leaf. None was biologically impossible, unsafe or
  # search-exhausted; all thirteen were simply one step past an experiment nobody had continued.

  - id: STAB03
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does an actuator outside the four already interrogated raise this substrate's steady-state abundance — CHIP/STUB1 triage, autophagic-lysosomal clearance, or HSP70/DNAJ co-chaperone capacity?"
    why_unresolved: "CV_BUBR1_ABUNDANCE was never closed; four actuators were. Named machinery outside P1-P4 exists and has been shown to govern missense-variant abundance in other proteins: CHIP's co-chaperone and E3 activities are separable, a disease variant of another receptor is cleared by autophagy, and HSP90 buffers deleterious missense variation in BRCA1."
    evidence: ["PMID:42567515", "PMID:41525846", "PMID:41265458", "PMID:34544131"]
    outcomes:
      abundance_raised:        S_REF_STABILISABLE
      turnover_reduced_only:   B_TURNOVER_ONLY
      no_effect:               T_CV_ABUNDANCE_EXHAUSTED
      insufficient:            T_STAB03_REPEAT

  - id: CENPE_F3
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does raising CENP-E activity improve alignment at the residual BubR1 this case has, exploiting the dependency rather than being blocked by it?"
    why_unresolved: "CENP-E needs BubR1 for its congression function, which closes it as a replacement and opens it as an F3 candidate: if the residual protein is enough to support a boosted CENP-E, the dependency is a lever instead of an obstacle. No experiment has tried it at limiting BubR1."
    outcomes:
      improves_at_residual_bubr1: S_FLUX_COMPENSATORY
      needs_more_bubr1:           S_FLUX_NEEDS_MORE_BUBR1
      no_improvement:             T_CENPE_F3_NULL
      insufficient:               T_CENPE_F3_REPEAT

  - id: KIF18A_F3
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does modulating KIF18A improve alignment at residual BubR1?"
    why_unresolved: "Same shape as CENP-E, and KIF18A is the better-handled of the two. Its congression role runs through CENP-E and therefore through BubR1, which makes it compensatory rather than independent, and the flux work already uses KIF18A depletion as the state it rescues."
    outcomes:
      improves_at_residual_bubr1: S_FLUX_COMPENSATORY
      worsens_alignment:          S_FLUX_NOT_THE_LEVER
      no_improvement:             T_KIF18A_F3_NULL
      insufficient:               T_KIF18A_F3_REPEAT

  - id: COMBO01
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does a partial abundance gain plus flux modification reach the functional state where neither does alone?"
    why_unresolved: "A benefit that needs more BubR1 than the case has is not a closed route if abundance can be raised a little. F1 and F3 were treated as alternatives; in combination the abundance requirement of the flux benefit may be met without full restoration. Untested in either direction."
    outcomes:
      combination_sufficient: S_FLUX_COMPENSATORY
      still_insufficient:     T_COMBO_INSUFFICIENT
      combination_harmful:    T_UNSAFE_COMBO
      insufficient:           T_COMBO_REPEAT

  - id: TRIP13_02
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does temporally restricted TRIP13 augmentation restore exit without degrading activation?"
    why_unresolved: "The conflict is not intrinsic, and the source separates the two roles in time: TRIP13 maintains open-state Mad2 for activation during interphase, and disassembles MCC for exit during mitosis. A mitosis-restricted augmentation therefore has a mechanistic basis, and nothing tests it."
    evidence: ["PMID:30341343"]
    outcomes:
      exit_restored_activation_intact: S_SIL_SUPPLIED
      conflict_persists:               T_TRIP13_INTRINSIC
      insufficient:                    T_TRIP13_02_REPEAT

  - id: TRIP13_F3
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does TRIP13/APC15 augmentation improve silencing at residual BubR1, exploiting the BubR1-containing substrate rather than replacing it?"
    why_unresolved: "TRIP13 acts on a BubR1-containing complex, so dependency makes it compensatory rather than dead. Whether a weaker MCC is still a usable substrate at limiting BubR1 is unasked."
    outcomes:
      improves_at_residual_bubr1: S_SIL_SUPPLIED
      no_improvement:             T_TRIP13_F3_NULL
      insufficient:               T_TRIP13_F3_REPEAT

  - id: POOL01
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Is the kinetochore pool of BubR1 the functionally limiting one, so that a pool-confined gain is sufficient?"
    why_unresolved: "A pool-confined change was treated as a failed route to whole-cell abundance, which assumes whole-cell abundance is what function needs. The case's own evidence points the other way: residual mutant protein reaches kinetochores, and BubR1 acts there. Nobody has asked whether the pool is enough."
    evidence: ["PMID:20516114", "PMID:38008853"]
    outcomes:
      pool_is_sufficient:     S_POOL_SUFFICES
      whole_cell_required:    T_POOL_INSUFFICIENT
      insufficient:           T_POOL01_REPEAT

  - id: FOLD01
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Can the raised-but-non-functional protein be brought to a native, functional state by assisting folding rather than by adding more of it?"
    why_unresolved: "Abundance and nativeness were conflated. A chaperone-retained or aggregation-prone protein can be abundant and non-functional, and the global-suppressor work reports that rescue of folding defects runs through refolding rate rather than thermodynamic stability. Nothing tests whether this substrate's functional fraction can be raised independently of its total."
    evidence: ["PMID:36037221", "PMID:20516114"]
    outcomes:
      functional_fraction_raised: S_STABILISED_FUNCTIONAL
      abundance_without_function: T_FOLD_INTRINSIC
      insufficient:               T_FOLD01_REPEAT

  - id: LIMFN01
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Which function is actually limiting missegregation in this state?"
    why_unresolved: "A composite that supplies alignment, activation and silencing and does not lower missegregation says the limiting quantity was none of them. Attachment error-correction rate, kinetochore-microtubule turnover and cohesion are candidates the map has never separated."
    outcomes:
      a_supplied_function_was_limiting: S_RETEST_COMPOSITE
      another_quantity_is_limiting:     S_NEW_CONTROL_VARIABLE
      insufficient:                     T_LIMFN01_REPEAT
  - {id: S_RETEST_COMPOSITE, kind: state, label: "One of the supplied functions was limiting after all: the composite is revalidated with that function's contribution isolated"}
  - {id: S_NEW_CONTROL_VARIABLE, kind: state, label: "A control variable outside this map limits missegregation in this state: it must be named and searched before any route can address it"}

  - id: COMPOSITE02
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does a different configuration of the same components — different stoichiometry, or temporal separation — resolve the conflict?"
    why_unresolved: "A conflict in one configuration is not a property of the component set. TRIP13's own two roles are temporally separable, which is the existence proof that configuration matters here."
    outcomes:
      reconfiguration_works: S_COMPOSITE_VALIDATED
      conflict_intrinsic:    T_COMPOSITE_INTRINSIC
      insufficient:          T_COMPOSITE02_REPEAT

  - id: ACT02
    kind: branch
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Can arrest competence be supplied through the MPS1 phosphorylation cascade, transiently rather than chronically?"
    why_unresolved: "The first two search depths found no component; the third found a mechanistic handle — a sequential multi-target MPS1 phosphorylation cascade promotes checkpoint signalling. The same depth found that CHRONIC checkpoint activation causes myelosuppression and gastrointestinal atrophy in vivo, so the sustained form of this variable is organism-level harmful while a transient form is not covered by that evidence."
    evidence: ["PMID:28072388", "PMID:38806674"]
    outcomes:
      transient_supply_works:   S_ACT_SUPPLIED
      only_chronic_supply_works: T_ACT_CHRONIC_UNSAFE
      no_supply:                T_ACT_EXHAUSTED
      insufficient:             T_ACT02_REPEAT

  # ---------- F4: remove the cells rather than prevent the error ----------
  - {id: CV_CLEARANCE_ENTRY, kind: state, label: "F4 entry: the aneuploid cell fraction is itself a control variable, and the only one that can touch aneuploidy already established"}
  - id: CLEAR01
    kind: branch
    resolves_by: MEASUREMENT
    requires: TISSUE_MODEL
    label: "Can the aneuploid cell fraction be lowered by promoting selective elimination of aneuploid cells?"
    why_unresolved: "Selective elimination of aneuploid cells is documented — cell competition removes segmental aneuploid cells in Drosophila imaginal discs, lineage-specific elimination operates in embryos and stem-cell-derived models, and depletion of aneuploid cells is shaped by cell-to-cell interactions. None of it is in a human MVA context, and none of it is an actuator yet."
    evidence: ["PMID:33847264", "PMID:42409819", "PMID:40466636"]
    outcomes:
      fraction_lowered_population_viable: S_TISSUE_FRACTION_FALLS
      population_depleted:                T_CLEAR_DEPLETES
      no_selective_elimination:           T_CLEAR_NULL
      insufficient:                       T_CLEAR01_REPEAT

  - id: CLIN02
    kind: branch
    resolves_by: MEASUREMENT
    requires: ORGANISM_MODEL
    label: "Which clinical feature, in which tissue, on what timescale, is linked to aneuploid burden?"
    why_unresolved: "A null on one chosen clinical measure does not close the link; it closes that measure. The phenotype is multi-system and the burden-to-feature mapping is unquantified for this disorder."
    outcomes:
      a_linked_feature_exists: S_CLINICAL_MODIFIED
      no_feature_links:        T_CLINICAL_LINK_ABSENT
      unassessable:            T_CLIN02_BLOCKED

  - id: XSCALE03
    kind: branch
    resolves_by: MEASUREMENT
    requires: TISSUE_MODEL
    label: "Is selection or clearance, rather than per-division fidelity, what sets the tissue aneuploid fraction here?"
    why_unresolved: "Per-division fidelity improving without the tissue fraction falling means the fraction is set by something else. That is a different control variable, and it is the F4 one."
    outcomes:
      selection_dominates:    CV_CLEARANCE_ENTRY
      fidelity_dominates:     T_AGGREGATION_UNEXPLAINED
      insufficient:           T_XSCALE03_REPEAT

  # new genuine terminals from the expansion
  - {id: T_CV_ABUNDANCE_EXHAUSTED, kind: terminal, terminal: SEARCHED_EXTERNAL_UNIVERSE_EXHAUSTED, label: "Every identified actuator of BubR1 abundance failed on this substrate across two search depths"}
  - {id: T_STAB03_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Actuator engagement not validated: repeat"}
  - {id: T_CENPE_F3_NULL, kind: terminal, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Boosting CENP-E does not help at residual BubR1 and no further CENP-E-directed experiment is identifiable"}
  - {id: T_CENPE_F3_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_KIF18A_F3_NULL, kind: terminal, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "KIF18A modulation does not help at residual BubR1"}
  - {id: T_KIF18A_F3_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_COMBO_INSUFFICIENT, kind: terminal, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Partial abundance plus flux modification is still insufficient, and no further combination of the mapped control variables is identifiable"}
  - {id: T_UNSAFE_COMBO, kind: terminal, terminal: UNSAFE, label: "The combination harms the population where neither component did"}
  - {id: T_COMBO_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_TRIP13_INTRINSIC, kind: terminal, terminal: PHYSICALLY_INCOMPATIBLE_WITH_EVIDENCE, label: "The activation and silencing roles cannot be separated even temporally: one protein cannot be augmented for one without costing the other"}
  - {id: T_TRIP13_02_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_TRIP13_F3_NULL, kind: terminal, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "TRIP13 augmentation does not help at residual BubR1"}
  - {id: T_TRIP13_F3_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: S_POOL_SUFFICES, kind: state, label: "The kinetochore pool is the functionally limiting one, so a pool-confined abundance gain is enough and whole-cell restoration is not required"}
  - {id: T_POOL_INSUFFICIENT, kind: terminal, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "The kinetochore pool is not sufficient and whole-cell abundance is required, which returns the route to CV_BUBR1_ABUNDANCE with its actuators already enumerated"}
  - {id: T_POOL01_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_FOLD_INTRINSIC, kind: terminal, terminal: PHYSICALLY_INCOMPATIBLE_WITH_EVIDENCE, label: "The protein cannot be made native by assisting folding: abundance and nativeness are not separable for this substrate"}
  - {id: T_FOLD01_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_LIMFN01_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_COMPOSITE_INTRINSIC, kind: terminal, terminal: PHYSICALLY_INCOMPATIBLE_WITH_EVIDENCE, label: "The component set conflicts in every reachable configuration"}
  - {id: T_COMPOSITE02_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_ACT_CHRONIC_UNSAFE, kind: terminal, terminal: UNSAFE, label: "Arrest competence can only be supplied chronically, and chronic checkpoint activation causes myelosuppression and gastrointestinal atrophy in vivo. This closes the variable in its sustained form on evidence about the variable, not about one actuator"}
  - {id: T_ACT_EXHAUSTED, kind: terminal, terminal: SEARCHED_EXTERNAL_UNIVERSE_EXHAUSTED, label: "No way to supply arrest competence survived three search depths and a mechanistic-handle test"}
  - {id: T_ACT02_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_CLEAR_DEPLETES, kind: terminal, terminal: UNSAFE, label: "Selective elimination lowers the aneuploid fraction by depleting the population: the confounder B08 and B18 exist to catch, arriving as the mechanism rather than as an artefact"}
  - {id: T_CLEAR_NULL, kind: terminal, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "No selective elimination of aneuploid cells is inducible in this context"}
  - {id: T_CLEAR01_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}
  - {id: T_CLINICAL_LINK_ABSENT, kind: terminal, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "No clinical feature is linked to aneuploid burden on any assessable measure"}
  - {id: T_CLIN02_BLOCKED, kind: terminal, terminal: GOVERNANCE_BLOCKED, label: "Not assessable: no intervention or longitudinal observation in this child is authorised"}
  - {id: T_AGGREGATION_UNEXPLAINED, kind: terminal, terminal: DECLARED_SCIENTIFIC_FRONTIER, label: "Fidelity dominates and the tissue fraction still does not fall: the discrepancy has no identified next experiment"}
  - {id: T_XSCALE03_REPEAT, kind: terminal, terminal: BOUNDED_FRONTIER, label: "Repeat under a valid condition"}

edges:
  # forward reachability from the case state
  # The disease state is observed, not inferred from a mechanism: the child has mosaic variegated
  # aneuploidy whatever the reason for the protein level. This edge is what makes the bypass family
  # independent of CHAR01 — a component that supplies a lost function does not care why BubR1 is low.
  - {from: S0_CASE, to: S_MISSEGREGATION, label: GROUNDED, note: "Observed phenotype: random aneuploidies and elevated premature chromatid separation, confirmed cytogenetically"}
  - {from: S0_CASE, to: S_CLASS_PREMISE, label: GROUNDED, note: "The missense allele sits in the protein kinase domain, from the case's own protein-feature evidence", evidence: [mechanism_run_RUN_20261005T142213Z_dd4b1e]}
  - {from: S_CLASS_PREMISE, to: CHAR01, label: EXPERIMENTAL_UNKNOWN, note: "The class premise has never been tested on this allele. This is the transfer every abundance route silently assumes"}
  - {from: S_ABUNDANCE_LOW, to: S_MISSEGREGATION, label: CONTEXT_TRANSFER_REQUIRED, note: "Direction grounded by doxycycline titration (~6% of wild-type missegregates in most cells, ~13% is near-normal); the magnitude was measured with normal protein in HeLa and does not transfer", evidence: ["PMID:20516114"]}
  - {from: S_ABUNDANCE_LOW_OTHER, to: EXP01, label: EXPERIMENTAL_UNKNOWN, note: "Function at matched abundance is still the right question; only the stabilisation mechanism grounding is lost"}
  # The disease state is not a dead end: both families leave from it, and the bypass family does not
  # wait on EXP01. Nothing about supplying a lost function independently depends on first learning
  # whether the child's own protein would work at matched abundance.
  - {from: S_MISSEGREGATION, to: C_CENPE, label: GROUNDED, note: "CENP-E is required for congression of polar chromosomes", evidence: ["PMID:41120314"]}
  - {from: S_MISSEGREGATION, to: C_KIF18A, label: GROUNDED, note: "KIF18A promotes congression, from a genome-wide screen", evidence: ["PMID:41218610"]}
  - {from: S_MISSEGREGATION, to: C_FLUX, label: GROUNDED, note: "Poleward flux reported as a target for modifying segregation errors", evidence: ["PMID:39541344"]}
  - {from: S_MISSEGREGATION, to: C_TRIP13, label: GROUNDED, note: "TRIP13 and APC15 drive mitotic exit by MCC turnover", evidence: ["PMID:30341343"]}
  - {from: S_MISSEGREGATION, to: BYPASS_ACT, label: PHYSICAL_ACTUATOR_MISSING, note: "No named candidate survived function-first discovery for checkpoint activation; available from the current state and independent of EXP01's result"}
  # CENP-E is closed by evidence rather than left unresolved: it has a BubR1-independent route to the
  # outer corona, and the mechanism by which it initiates congression is explicitly BubR1-dependent.
  # Localisation is not function — the same distinction Y155C forces.
  # Adjudicated at figure level, because a branch-closing claim is load-bearing. Fig. 6f: CENP-E
  # reactivation in BubR1-depleted cells did not trigger congression of polar chromosomes. Fig. 5c:
  # Aurora B inhibition in cells lacking both CENP-E activity and BubR1 blocked congression
  # completely, so BubR1's requirement is independent of its CENP-E-recruitment role and cannot be
  # compensated by inhibiting Aurora kinases. PMID:38354735's BubR1-independent pathway is measured
  # purely as CENP-E intensity relative to CENP-C — localisation, with no functional readout.
  - {from: C_CENPE, to: S_CENPE_BUBR1_DEPENDENT, label: GROUNDED, note: "Fig. 6f and Fig. 5c of PMID:41120314; the BubR1-independent route of PMID:38354735 is localisation only", evidence: ["PMID:41120314", "PMID:38354735"]}
  - {from: C_KIF18A, to: DEP_KIF18A, label: EXPERIMENTAL_UNKNOWN}
  - {from: C_FLUX, to: DEP_FLUX, label: EXPERIMENTAL_UNKNOWN}
  - {from: C_TRIP13, to: DEP_TRIP13, label: EXPERIMENTAL_UNKNOWN}
  # Normal abundance excludes a simple low-abundance explanation. It does not say which function is
  # broken, or that more than one is: Y155C is normally expressed and loses exactly one.
  - {from: S_ABUNDANCE_NORMAL, to: EXP01, label: EXPERIMENTAL_UNKNOWN, note: "Routes to exact functional characterisation; the matching requirement is already satisfied, so EXP01 reads as a direct function test", evidence: ["PMID:20516114"]}
  # the abundance family
  - {from: S_ABUNDANCE_LOW, to: EXP01, label: EXPERIMENTAL_UNKNOWN}
  - {from: S_FUNCTION_OK, to: S_MATCHED_ACHIEVABLE, label: GROUNDED, note: "EXP01 returning full function entails matched abundance was achieved, which is its own gate"}
  - {from: S_MATCHED_ACHIEVABLE, to: STAB01, label: PHYSICAL_ACTUATOR_MISSING, note: "Ectopic matching is a laboratory condition, not a control the case can hold. A physical actuator is required and none is grounded"}
  - {from: S_REF_STABILISABLE, to: STAB02, label: EXPERIMENTAL_UNKNOWN}
  - {from: S_CASE_STABILISABLE, to: FUNCVAL01, label: EXPERIMENTAL_UNKNOWN}
  - {from: S_STABILISED_FUNCTIONAL, to: XFER01, label: CONTEXT_TRANSFER_REQUIRED}
  - {from: S_XFER_OK, to: F1_COMPLETE, label: GROUNDED, note: "AND-node member"}
  # The population endpoints are gates on outcome assignment, not separate route steps: EXP01 assigns
  # no functional outcome unless viability, death and division are valid, so a route that reaches a
  # functional state has observed them in the same experiment rather than assuming them.
  - {from: S_FUNCTION_OK, to: S_POP_SAFE_F1, label: GROUNDED, note: "Observed by EXP01's required safety readouts, which gate its own outcome assignment"}
  - {from: S_ALIGN_SUPPLIED, to: SAFE01, label: EXPERIMENTAL_UNKNOWN, note: "A bypass component has no safety record at all, so population safety is a branch rather than an inherited property"}
  - {from: F1_COMPLETE, to: CANONICAL_CELLULAR_STATE, label: CONCEPTUALLY_SUFFICIENT_ONLY, note: "Restoring abundance of a functional protein in the relevant cell is sufficient in model. Population endpoints (viability, division, death) must still be observed, never assumed"}
  - {from: B_TURNOVER_ONLY, to: STAB01, label: EXPERIMENTAL_UNKNOWN, reentry: true, note: "Re-enters STAB01 on the folding-capacity arm (P1-R) rather than the degradative arm. A deliberate loop: the same branch node asked of a different arm"}
  # negative EXP01 branches route into the bypass family
  - {from: B_ALIGN_DEFECT, to: C_KIF18A, label: GROUNDED, note: "Alignment must be supplied independently. The requirement is grounded (central region 484-715); the component is not"}
  - {from: B_SIL_DEFECT, to: C_TRIP13, label: GROUNDED}
  - {from: B_SEG_DEFECT, to: C_KIF18A, label: CONCEPTUALLY_SUFFICIENT_ONLY, note: "Segregation fidelity is downstream of alignment and checkpoint; a segregation-only defect is addressed through whichever upstream function is failing"}
  - {from: B_MULTI_DEFECT, to: C_KIF18A, label: GROUNDED, note: "Composite replacement: each lost function must be supplied, and the functions are separable, so they must be supplied separately", evidence: ["PMID:20516114"]}
  - {from: B_MULTI_DEFECT, to: C_TRIP13, label: GROUNDED}
  - {from: B_MULTI_DEFECT, to: BYPASS_ACT, label: PHYSICAL_ACTUATOR_MISSING}
  # Failing to express an allele in one construct is an expression-validity result before it is a
  # biological one. It opens stabilisation and bypass; it does not close the abundance family.
  - {from: S_NOT_EXPRESSIBLE, to: STAB01, label: EXPERIMENTAL_UNKNOWN, note: "Can the protein be held up at all? A stabilising perturbation may raise what a promoter could not"}
  # An established ceiling is still not the end of the abundance family: expression and stabilisation
  # are different levers, and a protein that a promoter cannot raise may still be one a chaperone or
  # degradation perturbation can.
  - {from: S_PROTEIN_CEILING, to: STAB01, label: EXPERIMENTAL_UNKNOWN, note: "Stabilisation is a different lever from expression"}
  - {from: S_PROTEIN_CEILING, to: C_KIF18A, label: GROUNDED, family_transition: true, note: "Bypass remains available"}
  - {from: S_NOT_EXPRESSIBLE, to: EXPRVAL01, label: EXPERIMENTAL_UNKNOWN, note: "Expression validity: codon usage, construct design, promoter strength and degradation during expression are testable before concluding anything about the protein"}
  - {from: S_NOT_EXPRESSIBLE, to: C_KIF18A, label: GROUNDED, family_transition: true, note: "Bypass remains available as an alternative continuation"}
  - {from: S_ALIGN_SUPPLIED, to: F2_COMPLETE, label: GROUNDED, note: "AND-node member"}
  - {from: S_SIL_SUPPLIED, to: F2_COMPLETE, label: GROUNDED, note: "AND-node member"}
  - {from: S_ACT_SUPPLIED, to: F2_COMPLETE, label: GROUNDED, note: "AND-node member"}
  - {from: S_POP_SAFE_F2, to: F2_COMPLETE, label: GROUNDED, note: "AND-node member"}
  # EXP01's safety readouts describe ectopic expression of the altered protein. The actuator that
  # finally raises abundance is a different manipulation with its own population effects, and a
  # chaperone or degradation perturbation is exactly the kind that is broadly cytotoxic.
  - {from: S_POP_SAFE_F1, to: SAFE02, label: EXPERIMENTAL_UNKNOWN, note: "EXP01 safety does not transfer to the stabilisation actuator"}
  - {from: S_POP_SAFE_F1B, to: F1_COMPLETE, label: GROUNDED, note: "AND-node member"}
  # Reaching the cell-level state is not the disease being addressed. Three separate questions follow,
  # and the third bounds the other two whatever they return.
  - {from: CANONICAL_CELLULAR_STATE, to: S_MIS_LOWERED, label: GROUNDED, note: "The canonical trajectory entails the terminal state; it is one route to it, not the definition of it"}
  - {from: S_FLUX_NOT_THE_LEVER, to: C_KIF18A, label: GROUNDED, reentry: true, note: "The other named alignment candidate remains"}
  - {from: S_FLUX_NOT_THE_LEVER, to: CHAR01, label: EXPERIMENTAL_UNKNOWN, reentry: true, note: "And the abundance family is untouched by a flux null"}
  - {from: S_FLUX_COMPENSATORY, to: S_MIS_LOWERED, label: CONCEPTUALLY_SUFFICIENT_ONLY, note: "Reaches the terminal endpoint by exploiting residual function rather than replacing it; the functional target does not ask which", evidence: ["PMID:39541344"]}
  - {from: S_FLUX_COMPENSATORY, to: S_ALIGN_SUPPLIED, label: CONCEPTUALLY_SUFFICIENT_ONLY, note: "It supplies alignment compensatorily, which the canonical state would still have to account for"}
  - {from: S_FLUX_LOWERS_MIS, to: S_MIS_LOWERED, label: CONCEPTUALLY_SUFFICIENT_ONLY, note: "The flux work measures lagging chromosomes and micronuclei directly — the terminal endpoint, not a canonical intermediate", evidence: ["PMID:39541344"]}
  - {from: S_FLUX_LOWERS_MIS, to: S_ALIGN_SUPPLIED, label: GROUNDED, note: "It also supplies alignment, which the canonical state still needs"}
  - {from: S_POP_SAFE_F1B, to: S_POP_SAFE_ANY, label: GROUNDED, note: "Either family's own safety observation satisfies the functional target's safety conjunct"}
  - {from: S_POP_SAFE_F2, to: S_POP_SAFE_ANY, label: GROUNDED, note: "Either family's own safety observation satisfies the functional target's safety conjunct"}
  - {from: S_MIS_LOWERED, to: FUNCTIONAL_CELLULAR_TARGET, label: GROUNDED, note: "AND-node member"}
  - {from: S_POP_SAFE_ANY, to: FUNCTIONAL_CELLULAR_TARGET, label: GROUNDED, note: "AND-node member"}
  - {from: S_CHECKPOINT_RISK_RESOLVED, to: ORGANISM_TARGET, label: GROUNDED, note: "AND-node member: the risk gate sits on organism advancement, not on the cell state"}
  - {from: FUNCTIONAL_CELLULAR_TARGET, to: ACT_SAFETY01, label: EXPERIMENTAL_UNKNOWN, note: "Reaching the cell state is what makes the organism-risk question live; it is not what answers it"}
  - {from: S_ACT_COMPETENCE_REQUIRED, to: BYPASS_ACT, label: PHYSICAL_ACTUATOR_MISSING, reentry: true, note: "Reopens component discovery for checkpoint activation — and only this result authorises reopening it"}
  - {from: S_ACT_COMPETENCE_REQUIRED, to: CHAR01, label: EXPERIMENTAL_UNKNOWN, reentry: true, note: "The abundance family supplies checkpoint competence through BubR1 itself, so it re-enters at its own first experiment"}
  - {from: S_ACT_SUPPLIED, to: S_CHECKPOINT_RISK_RESOLVED, label: CONCEPTUALLY_SUFFICIENT_ONLY, note: "Supplying activation satisfies the risk gate by meeting the requirement rather than by showing it unnecessary"}
  - {from: CANONICAL_CELLULAR_STATE, to: S_CHECKPOINT_RISK_RESOLVED, label: CONCEPTUALLY_SUFFICIENT_ONLY, note: "The canonical state includes checkpoint competence, so it satisfies the gate by meeting it"}
  - {from: FUNCTIONAL_CELLULAR_TARGET, to: XSCALE01, label: EXPERIMENTAL_UNKNOWN, note: "Per-division fidelity to tissue aneuploid fraction"}
  - {from: FUNCTIONAL_CELLULAR_TARGET, to: IRREV01, label: EXPERIMENTAL_UNKNOWN, note: "How much of the phenotype is still ahead of the child"}
  - {from: FUNCTIONAL_CELLULAR_TARGET, to: SAFE_ORG, label: EXPERIMENTAL_UNKNOWN, note: "Organism-level safety of whatever actuator got here"}
  - {from: S_TISSUE_FRACTION_FALLS, to: XSCALE02, label: EXPERIMENTAL_UNKNOWN}
  - {from: S_CLINICAL_MODIFIED, to: ORGANISM_TARGET, label: GROUNDED, note: "AND-node member"}
  - {from: S_PROSPECTIVE_EXISTS, to: ORGANISM_TARGET, label: GROUNDED, note: "AND-node member: without a prospective component there is nothing for a route to change"}
  - {from: S_ORG_SAFE, to: ORGANISM_TARGET, label: GROUNDED, note: "AND-node member"}
  - {from: ORGANISM_TARGET, to: T_ORGANISM_REACHED, label: CONCEPTUALLY_SUFFICIENT_ONLY, note: "Reached in model only; no route in this map gets here today and none is authorised in this child"}
  # Assembling components that each supply a function is not evidence that the assembled system
  # yields the biological state. The functions interact, and TRIP13 is the proof of concept for the
  # worry: the same protein supports checkpoint activation and drives mitotic exit, so augmenting it
  # for silencing cannot be assumed to leave activation intact.
  - {from: F2_COMPLETE, to: COMPOSITE_VALID, label: EXPERIMENTAL_UNKNOWN, note: "The assembled system must be shown to produce the state, not credited for its parts"}
  - {from: S_COMPOSITE_VALIDATED, to: CANONICAL_CELLULAR_STATE, label: CONCEPTUALLY_SUFFICIENT_ONLY, note: "Validated as a system in the tested context; transfer to a relevant cell type remains separate"}
  # backward regression from the target, merged where it meets the forward graph
  - {from: S_P1P4_EXHAUSTED, to: C_KIF18A, label: GROUNDED, family_transition: true, note: "Merge point: a dead abundance actuator and a failed EXP01 arrive at the same bypass family"}
  - {from: T_EXP01_CEILING, to: STAB01, label: PHYSICAL_ACTUATOR_MISSING, family_transition: true, note: "Matched abundance unreachable ectopically closes the function question and opens the stabilisation question: can it be held up at all?"}

# Transitions that are grounded and therefore traversed rather than branched.
  # ================= Rule 1: the continuation after each retired leaf =================
  - {from: S_CASE_REFRACTORY, to: STAB03, label: EXPERIMENTAL_UNKNOWN, reentry: true, note: "Four actuators failed; the control variable has three more identified and untried"}
  - {from: S_P1P4_EXHAUSTED, to: STAB03, label: EXPERIMENTAL_UNKNOWN, note: "Same move for the reference class: actuators are not the variable"}
  - {from: S_CENPE_BUBR1_DEPENDENT, to: CENPE_F3, label: EXPERIMENTAL_UNKNOWN, note: "Dependency reclassifies CENP-E from F2 to F3 instead of closing it"}
  - {from: S_KIF18A_BUBR1_DEPENDENT, to: KIF18A_F3, label: EXPERIMENTAL_UNKNOWN}
  - {from: S_TRIP13_BUBR1_DEPENDENT, to: TRIP13_F3, label: EXPERIMENTAL_UNKNOWN}
  - {from: S_FLUX_NEEDS_MORE_BUBR1, to: COMBO01, label: EXPERIMENTAL_UNKNOWN, note: "F1 and F3 in combination, which the map had never considered because the families were treated as alternatives"}
  - {from: S_TRIP13_CONFLICTED, to: TRIP13_02, label: EXPERIMENTAL_UNKNOWN, note: "The two roles are temporally separate in the source, so the conflict is not established as intrinsic"}
  - {from: S_POOL_SUFFICES, to: FUNCVAL01, label: EXPERIMENTAL_UNKNOWN, reentry: true, note: "Function under the pool-confined gain is still its own question"}
  - {from: S_POOL_ONLY, to: POOL01, label: EXPERIMENTAL_UNKNOWN, note: "Whether the pool is enough was assumed, never asked"}
  - {from: S_PRESENT_NON_NATIVE, to: FOLD01, label: EXPERIMENTAL_UNKNOWN, note: "Abundance and nativeness were conflated"}
  - {from: S_RETEST_COMPOSITE, to: COMPOSITE_VALID, label: EXPERIMENTAL_UNKNOWN, reentry: true, note: "Revalidation of the same branch with a different configuration"}
  - {from: S_COMPOSITE_INEFFECTIVE, to: LIMFN01, label: EXPERIMENTAL_UNKNOWN, note: "If supplying three functions changes nothing, the limiting quantity is a fourth"}
  - {from: S_COMPOSITE_CONFLICTED, to: COMPOSITE02, label: EXPERIMENTAL_UNKNOWN}
  - {from: S_ACT_NO_COMPONENT_YET, to: ACT02, label: EXPERIMENTAL_UNKNOWN, note: "A third search depth found a mechanistic handle and a toxicity boundary; both are new"}
  - {from: S_AGGREGATION_FAILS, to: XSCALE03, label: EXPERIMENTAL_UNKNOWN}
  - {from: S_CLINICAL_LINK_UNRESOLVED, to: CLIN02, label: EXPERIMENTAL_UNKNOWN}
  # F4 is reachable from the established-burden state and from the aggregation failure: it is the only
  # family that can act on aneuploidy that already exists.
  - {from: S_ESTABLISHED_BURDEN, to: CV_CLEARANCE_ENTRY, label: CONCEPTUALLY_SUFFICIENT_ONLY, note: "Improving future divisions cannot undo an aneuploid cell that exists; removing it is a different variable"}
  - {from: CV_CLEARANCE_ENTRY, to: CLEAR01, label: EXPERIMENTAL_UNKNOWN}
  - {from: S_ESTABLISHED_BURDEN, to: IRREV01, label: EXPERIMENTAL_UNKNOWN, reentry: true, note: "And the prospective component remains, whatever is fixed"}
  - {from: S_NEW_CONTROL_VARIABLE, to: BYPASS_ACT, label: PHYSICAL_ACTUATOR_MISSING, reentry: true, note: "A variable outside the map must be named and searched; the nearest existing discovery node is where that search re-enters"}

grounded_facts:
  - {id: G_KINASE_DISPENSABLE, statement: "Neither kinase activity nor the 265-residue kinase domain is required for checkpoint or stable attachments (731X restores both)", evidence: ["PMID:20516114"], consequence: "Any route premised on restoring BubR1 kinase activity is eliminated and does not appear in this map"}
  - {id: G_SEPARABLE, statement: "Alignment and checkpoint are separable functions (Y155C restores alignment and not checkpoint; 483X the converse)", evidence: ["PMID:20516114"], consequence: "Composite bypass must supply each function separately; one component is not assumed to cover both"}
  - {id: G_ALIGN_REGION, statement: "Stable kinetochore-microtubule attachment relies on the central region 484-715", evidence: ["PMID:20516114"]}
  - {id: G_ACT_REGION, statement: "The N-terminal TPR domain is required for checkpoint signalling via KNL1/Blinkin", evidence: ["PMID:20516114"]}
  - {id: G_MECHANISM, statement: "For the reference substrates, low abundance arises from HSP90-dependent misfolding and proteasomal clearance at normal transcript level", evidence: ["PMID:20516114"], consequence: "Grounds P1/P2 in the destabilising direction only"}
  - {id: G_SIRT2, statement: "SIRT2 activity and BubR1 abundance are coupled through K668 acetylation: raising SIRT2 raises abundance in mouse tissue, inhibiting Sirt2 destabilises BubR1 in human cells", evidence: ["PMID:24825348", "PMID:25672491"], consequence: "A grounded relation, untested on a misfolding substrate; it is the best-grounded candidate mechanism for STAB01 and grounds no rescue direction"}
  - {id: G_BUBR1_REQUIRED_FOR_CONGRESSION, statement: "BubR1 is required for the initiation of chromosome congression independently of its role in recruiting CENP-E, and its absence cannot be compensated by inhibiting Aurora kinases", evidence: ["PMID:41120314"], consequence: "Raises the bar for any alignment bypass: the function to be supplied is one BubR1 is directly required for, not merely one it assists"}
  - {id: G_NO_LIMITING_EXPERIMENT, statement: "Across all five full texts adjudicated, every experiment ran at BubR1-present or BubR1-absent (siRNA or degron depletion). None ran at BubR1-limiting", evidence: ["PMID:41120314", "PMID:38354735", "PMID:41218610", "PMID:39541344", "PMID:30341343"], consequence: "This case is BubR1-limiting, not BubR1-null. Every dependency verdict in the literature is therefore about a different regime, and that is why each dependency branch keeps an `unestablished` outcome rather than resolving on the published work"}
  - {id: G_LOCALISATION_NOT_FUNCTION, statement: "A BubR1-independent route can target a component to the kinetochore without being shown to deliver the component's function", evidence: ["PMID:38354735", "PMID:41120314"], consequence: "The same distinction Y155C forces inside this case: normal localisation with a dead function. A bypass candidate must be adjudicated on its function, never on its localisation"}
  - {id: G_THREE_FAMILIES, statement: "Three route families are distinguishable once independence stops being a success criterion: F1 repairs or stabilises the defective protein, F2 supplies a lost function without it, and F3 exploits the residual function that is present while altering a different physical process", derivation: "Structural consequence of this map, not a literature claim: it follows from defining the functional target by the terminal cellular state and from DEP_FLUX carrying independence as a classification rather than a success criterion", consequence: "F3 is only visible because the functional target is defined by the terminal cellular state rather than by the canonical trajectory. An approach that required repairing the gene first would not look for it"}
  - {id: G_KEN_SELF_DEFEATING, statement: "The BubR1 KEN degron is also required for checkpoint function", evidence: ["PMID:17406666", "PMID:20516114"], consequence: "Degron disruption is excluded as a stabilisation route on function grounds, not evidence grounds"}
