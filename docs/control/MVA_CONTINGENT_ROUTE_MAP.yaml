  # ================= continuations opened by the Rule 5 audit =================
  # Each of these existed as a NO_KNOWN_CONTINUATION leaf. None was biologically impossible, unsafe or
  # search-exhausted; all thirteen were simply one step past an experiment nobody had continued.

  - id: STAB03
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does an actuator outside the four already interrogated raise this substrate's steady-state abundance — CHIP/STUB1 triage, autophagic-lysosomal clearance, or HSP70/DNAJ co-chaperone capacity?"
    why_unresolved: "CV_BUBR1_ABUNDANCE was never closed; four actuators were. Named machinery outside P1-P4 exists and has been shown to govern missense-variant abundance in other proteins: CHIP's co-chaperone and E3 activities are separable, a disease variant of another receptor is cleared by autophagy, and HSP90 buffers deleterious missense variation in BRCA1."
    evidence: ["PMID:42567515", "PMID:41525846", "PMID:41265458", "PMID:34544131"]
    outcomes:
      abundance_raised:        S_REF_STABILISABLE
      turnover_reduced_only:   B_TURNOVER_ONLY
      no_effect:               T_CV_ABUNDANCE_EXHAUSTED
      insufficient:            T_STAB03_REPEAT

  - id: CENPE_F3
    kind: branch
    branch_role: INTERVENTION
    resolves_by: MEASUREMENT
    requires: CELL_MODEL
    label: "Does raising CENP-E activity improve alignment at the residual BubR1 this case has, exploiting the dependency rather than being blocked by it?"
    why_unresolved: "CENP-E needs BubR1 for its congression function, which closes it as a replacement and opens it as an F3 candidate: if the residual protein is enough to support a boosted CENP-E, the dependency is a lever instead of an obstacle. No experiment has tried it at limiting BubR1."
    outcomes:
      improves_alignment_at_residual_bubr1: S_ALIGN_IMPROVED_COMPENSATORY
      needs_more_bubr1:           S_FLUX_NEEDS_MORE_BUBR1
      no_improvement:             T_CENPE_F3_NULL
      insufficient:               T_CENPE_F3_REPEAT

